<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone - Play. Connect. Win.</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0b0d17;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1, h2, h3, .logo {
      font-family: 'Orbitron', sans-serif;
    }
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.6;
    }
    .view-container {
      display: none;
      min-height: 100vh;
      padding: 20px;
    }
    .active-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* Auth Gateway Styling */
    .auth-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      text-align: center;
    }
    .auth-card h1 {
      font-size: 2rem;
      color: #00f0ff;
      margin-bottom: 10px;
    }
    .auth-card p {
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .input-group input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    .btn-cyber {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    .btn-cyber:hover {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      transform: translateY(-2px);
    }
    .btn-guest {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 10px;
    }
    .btn-guest:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    .auth-toggle {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .auth-toggle span {
      color: #00f0ff;
      cursor: pointer;
      font-weight: 600;
    }

    /* Dashboard Styling */
    .dashboard-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      padding: 15px 25px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 30px;
    }
    .logout-btn {
      background: #ef4444;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      color: white;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: 0.3s;
    }
    .logout-btn:hover {
      background: #dc2626;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      transition: 0.3s;
    }
    .game-card:hover {
      transform: translateY(-5px);
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .game-card h3 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }
    .game-card a {
      color: #00f0ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Three.js Background Canvas -->
  <canvas id="three-canvas"></canvas>

  <!-- VIEW 1: AUTH GATEWAY (Login / Signup / Guest) -->
  <div id="auth-view" class="view-container active-view">
    <div class="auth-card">
      <h1 id="auth-title">GAMEZONE</h1>
      <p id="auth-subtitle">Play. Connect. Win.</p>

      <!-- Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>
        <button type="submit" id="auth-submit-btn" class="btn-cyber">Login</button>
      </form>

      <!-- Guest Option -->
      <button onclick="continueAsGuest()" class="btn-cyber btn-guest">Play as Guest</button>

      <!-- Toggle Login/Signup -->
      <div class="auth-toggle" id="auth-toggle-text">
        Don't have an account? <span onclick="toggleAuthMode()">Create Account</span>
      </div>
    </div>
  </div>

  <!-- VIEW 2: GAMEZONE DASHBOARD -->
  <div id="dashboard-view" class="view-container">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <h2 class="logo">🎮 GameZone</h2>
        <div style="display: flex; align-items: center; gap: 15px;">
          <span id="user-display" style="color: #00f0ff; font-size: 0.95rem;"></span>
          <button onclick="handleLogout()" class="logout-btn">Logout</button>
        </div>
      </div>

      <h2 style="margin-bottom: 20px; font-size: 1.4rem;">🔥 Popular Games</h2>
      <div class="games-grid">
        <div class="game-card"><h3>Google Snake</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>2048</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>Aectris</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>Quick Draw</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>Chrome Dino</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>Little Alchemy 2</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>Minesweeper</h3><a href="#">Play Now ↗</a></div>
        <div class="game-card"><h3>Solitaire</h3><a href="#">Play Now ↗</a></div>
      </div>
    </div>
  </div>

  <script>
    // --- SUPABASE CONFIGURATION ---
    // Yahan apni real Supabase URL aur Publishable/Anon Key daalein
    const SUPABASE_URL = 'https://yfcdscjvebwvkvjvnaxi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AGSqsuA7Z9EYIPlGD-sHtQ_v5Ls6iXY';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUpMode = false;

    // --- CHECK SESSION ON LOAD ---
    window.addEventListener('DOMContentLoaded', async () => {
      const isGuest = localStorage.getItem('isGuest');
      if (isGuest === 'true') {
        showDashboard('Guest Player');
        return;
      }

      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard(session.user.email);
      } else {
        showAuthView();
      }
    });

    // --- VIEW SWITCHERS ---
    function showAuthView() {
      document.getElementById('auth-view').classList.add('active-view');
      document.getElementById('dashboard-view').classList.remove('active-view');
    }

    function showDashboard(identifier) {
      document.getElementById('user-display').innerText = identifier;
      document.getElementById('auth-view').classList.remove('active-view');
      document.getElementById('dashboard-view').classList.add('active-view');
    }

    // --- TOGGLE LOGIN / SIGNUP FORM ---
    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      const btn = document.getElementById('auth-submit-btn');
      const toggleText = document.getElementById('auth-toggle-text');

      if (isSignUpMode) {
        title.innerText = "SIGN UP";
        subtitle.innerText = "Create your GameZone account";
        btn.innerText = "Create Account";
        toggleText.innerHTML = 'Already have an account? <span onclick="toggleAuthMode()">Login</span>';
      } else {
        title.innerText = "GAMEZONE";
        subtitle.innerText = "Play. Connect. Win.";
        btn.innerText = "Login";
        toggleText.innerHTML = "Don't have an account? <span onclick=\"toggleAuthMode()\">Create Account</span>";
      }
    }

    // --- AUTH SUBMIT (Login / Sign Up) ---
    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (isSignUpMode) {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          alert(error.message);
        } else {
          alert('Account created successfully! Please login now.');
          toggleAuthMode();
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          alert(error.message);
        } else {
          localStorage.removeItem('isGuest');
          showDashboard(data.user.email);
        }
      }
    }

    // --- GUEST MODE ---
    function continueAsGuest() {
      localStorage.setItem('isGuest', 'true');
      showDashboard('Guest Player');
    }

    // --- FIXED LOGOUT FUNCTION ---
    async function handleLogout() {
      await supabase.auth.signOut();
      localStorage.removeItem('isGuest');
      document.getElementById('auth-form').reset();
      showAuthView();
    }

    // --- THREE.JS BACKGROUND ANIMATION ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);

    const geometry = new THREE.TorusKnotGeometry(3, 0.8, 100, 16);
    const material = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
    const torusKnot = new THREE.Mesh(geometry, material);
    scene.add(torusKnot);

    camera.position.z = 8;

    function animate() {
      requestAnimationFrame(animate);
      torusKnot.rotation.x += 0.005;
      torusKnot.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
