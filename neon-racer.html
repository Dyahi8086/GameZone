<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05060f"><link rel="stylesheet" href="main.css"><title>Neon Racer – GameZone</title></head><body class="game"><a class="btn back" href="games.html">← Library</a><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();onresize=rs;
let lane,O,sp,S,T,over,off;
function reset(){lane=1;O=[];sp=5;S=0;T=0;over=false;off=0}reset();
const lw=()=>Math.min(W/3.4,110),lx=i=>W/2+(i-1)*lw();
function go(d){if(over){reset();return}lane=Math.max(0,Math.min(2,lane+d))}
onpointerdown=e=>go(e.clientX<W/2?-1:1);
onkeydown=e=>{if(e.key=='ArrowLeft'||e.key=='a')go(-1);if(e.key=='ArrowRight'||e.key=='d')go(1);if(e.key==' '&&over)reset()};
function car(cx,y,col){x.fillStyle=x.shadowColor=col;x.fillRect(cx-17,y,34,60);x.fillStyle='#000';x.fillRect(cx-12,y+10,24,12)}
function loop(){T++;
if(!over){sp=5+S/400;off=(off+sp)%60;S+=sp/10;
if(T%Math.max(24,70-S/30|0)==0)O.push({l:Math.random()*3|0,y:-70});
O.forEach(o=>o.y+=sp);O=O.filter(o=>o.y<H+70);
if(O.some(o=>o.l==lane&&o.y>H-170&&o.y<H-60))over=true}
x.fillStyle='#070714';x.fillRect(0,0,W,H);x.shadowBlur=0;
const r=lw()*1.5;x.fillStyle='#10143a';x.fillRect(W/2-r,0,r*2,H);
x.strokeStyle='#a855f7';x.lineWidth=4;x.shadowBlur=10;x.shadowColor='#a855f7';
x.beginPath();x.moveTo(W/2-r,0);x.lineTo(W/2-r,H);x.moveTo(W/2+r,0);x.lineTo(W/2+r,H);x.stroke();
x.setLineDash([30,30]);x.lineDashOffset=-off;x.strokeStyle='#0ff';x.lineWidth=3;
for(const d of[-.5,.5]){x.beginPath();x.moveTo(W/2+d*lw()*2*.5*1,0);x.moveTo(W/2+d*lw(),0);x.lineTo(W/2+d*lw(),H);x.stroke()}
x.setLineDash([]);x.shadowBlur=14;
O.forEach(o=>car(lx(o.l),o.y,'#f2b'));car(lx(lane),H-120,'#0ff');
x.shadowBlur=0;x.fillStyle='#fff';x.font='18px sans-serif';x.textAlign='right';x.fillText('Score '+(S|0),W-14,30);
if(over){x.font='bold 28px sans-serif';x.textAlign='center';x.fillText('CRASH – tap to restart',W/2,H/2)}
requestAnimationFrame(loop)}loop()
</script></body></html>
