<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Trading Cards</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* --- 3D HOME SCREEN --- */
        #home-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 10;
            background-color: #f3f4f6;
        }

        #home-screen.hidden {
            opacity: 0;
            transform: scale(1.05); 
            pointer-events: none;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #000;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .enter-btn:hover, .enter-btn:active { 
            background: #000; 
            color: #ff69b4; 
            box-shadow: 0 0 30px #ff69b4; 
            transform: scale(1.05);
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 700;
            z-index: 100;
            color: #000;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* ========================================= */
        /* --- DASHBOARD (FUN SPORTS STYLE) --- */
        /* ========================================= */
        #dashboard-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #0f0f15; /* Very Dark Grey */
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #dashboard-screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        /* Header */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #0f0f15;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .dash-title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
        }

        .back-btn {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 20px; /* Pill shape */
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .back-btn:hover { background: #fff; color: #000; }

        /* 2x2 Grid for Cards */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px 20px 60px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* THE CARD DESIGN */
        .sports-card {
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            aspect-ratio: 3 / 4.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            /* 3D Pop effect on hover */
            transform-style: preserve-3d;
            border: 3px solid rgba(255,255,255,0.2);
        }

        .sports-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 40px rgba(0,0,0,0.7);
            border-color: rgba(255,255,255,0.6);
        }

        /* Card Gradients (Matching the Reference Image) */
        .bg-green { background: linear-gradient(180deg, #a8e063 0%, #56ab2f 100%); }
        .bg-pink { background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%); }
        .bg-teal { background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%); }
        .bg-purple { background: linear-gradient(180deg, #c471ed 0%, #f64f59 100%); }

        /* Top Text Area */
        .card-top-text {
            position: relative;
            z-index: 10;
            padding: 15px;
            text-align: right;
            color: #fff;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .card-date {
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 2px;
        }

        .card-action-text {
            font-size: 1.4rem;
            font-weight: 800;
        }
        
        /* Character Image (Popping out) */
        .card-character {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 110%; /* Make it bigger than card */
            height: 75%;
            background-size: contain;
            background-position: bottom center;
            background-repeat: no-repeat;
            z-index: 5;
            transition: transform 0.3s ease;
            /* Drop shadow to make it pop */
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
        }

        .sports-card:hover .card-character {
            transform: translateX(-50%) scale(1.05); /* Zoom effect on hover */
        }

        /* Bottom Info Area */
        .card-bottom-info {
            position: relative;
            z-index: 10;
            background: #111; /* Dark block at bottom */
            padding: 15px;
            border-top: 2px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%); /* Slanted cut */
            margin-top: -20px; /* Overlap the character */
        }

        .card-title-block {
            color: #fff;
        }

        .card-title-block h3 {
            font-size: 1.2rem;
            margin-bottom: 4px;
            font-weight: 900;
        }
        
        .card-title-block p {
            font-size: 0.7rem;
            color: #888;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Little decorative barcode lines */
        .barcode-lines {
            display: flex;
            gap: 3px;
            height: 20px;
            opacity: 0.5;
        }
        .barcode-lines div {
            width: 2px;
            background: #fff;
        }
        .barcode-lines div:nth-child(even) { width: 4px; }

        /* Responsive Fix for Phones */
        @media (max-width: 500px) {
            .cards-container {
                gap: 15px;
                padding: 10px 15px;
            }
            .card-top-text { padding: 10px; font-size: 0.8rem; }
            .card-action-text { font-size: 1.1rem; }
            .card-title-block h3 { font-size: 1rem; }
            .card-bottom-info { padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN -->
    <div id="home-screen">
        <div id="loading">Loading Experience...</div>
        <div id="canvas-container"></div>
        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
            </div>
            <div class="bottom-section">
                <button type="button" class="enter-btn" id="enterBtn">Enter GameZone</button>
            </div>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen">
        <div class="dash-header">
            <div class="dash-title">FUN GAMES</div>
            <button type="button" class="back-btn" id="backBtn">← Back</button>
        </div>

        <div class="cards-container">
            
            <!-- Card 1 (Green) -->
            <div class="sports-card bg-green">
                <div class="card-top-text">
                    <div class="card-date">LEVEL 1-10</div>
                    <div class="card-action-text">RACING</div>
                </div>
                <!-- Character Image -->
                <div class="card-character" style="background-image: url('https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=400&auto=format&fit=crop');"></div>
                
                <div class="card-bottom-info">
                    <div class="card-title-block">
                        <h3>Cyber Racer</h3>
                        <p>3D • ARCADE</p>
                    </div>
                    <div class="barcode-lines"><div></div><div></div><div></div><div></div></div>
                </div>
            </div>

            <!-- Card 2 (Pink) -->
            <div class="sports-card bg-pink">
                <div class="card-top-text" style="color: #333; text-shadow: none;">
                    <div class="card-date">LEVEL 5-15</div>
                    <div class="card-action-text">SHOOTER</div>
                </div>
                <div class="card-character" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400&auto=format&fit=crop');"></div>
                
                <div class="card-bottom-info" style="background: #1a1a1a;">
                    <div class="card-title-block">
                        <h3>Neon Strike</h3>
                        <p>FPS • MULTIPLAYER</p>
                    </div>
                    <div class="barcode-lines"><div></div><div></div><div></div><div></div></div>
                </div>
            </div>

            <!-- Card 3 (Teal) -->
            <div class="sports-card bg-teal">
                <div class="card-top-text">
                    <div class="card-date">LEVEL 1-5</div>
                    <div class="card-action-text">PUZZLE</div>
                </div>
                <div class="card-character" style="background-image: url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=400&auto=format&fit=crop');"></div>
                
                <div class="card-bottom-info">
                    <div class="card-title-block">
                        <h3>Mind Matrix</h3>
                        <p>LOGIC • BRAIN</p>
                    </div>
                    <div class="barcode-lines"><div></div><div></div><div></div><div></div></div>
                </div>
            </div>

            <!-- Card 4 (Purple) -->
            <div class="sports-card bg-purple">
                <div class="card-top-text">
                    <div class="card-date">LEVEL 20+</div>
                    <div class="card-action-text">ADVENTURE</div>
                </div>
                <div class="card-character" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=400&auto=format&fit=crop');"></div>
                
                <div class="card-bottom-info" style="background: #111;">
                    <div class="card-title-block">
                        <h3>Space Ace</h3>
                        <p>EXPLORATION</p>
                    </div>
                    <div class="barcode-lines"><div></div><div></div><div></div><div></div></div>
                </div>
            </div>

        </div>
    </div>

    <!-- 3D SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

        // --- UI LOGIC ---
        const enterBtn = document.getElementById('enterBtn');
        const backBtn = document.getElementById('backBtn');
        const homeScreen = document.getElementById('home-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');

        enterBtn.addEventListener('click', (e) => {
            e.preventDefault();
            homeScreen.classList.add('hidden');
            setTimeout(() => {
                dashboardScreen.classList.add('active');
            }, 300);
        });

        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            dashboardScreen.classList.remove('active');
            setTimeout(() => {
                homeScreen.classList.remove('hidden');
            }, 300);
        });

        // --- 3D SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf3f4f6); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; 
        renderer.shadowMap.enabled = true; 
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 20, 10);
        topLight.castShadow = true;
        scene.add(topLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const modelPath = './smol_ame_in_an_upcycled_terrarium_hololiveen.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 1.5; 
                        }
                    }
                });

                scene.add(model);

                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                const fixedDistance = maxDim * 2.0; 

                camera.position.set(fixedDistance * 0.4, fixedDistance * 0.3, fixedDistance * 0.9); 
                camera.lookAt(0, 0, 0);
                
                controls.target.set(0, 0, 0);
                controls.minDistance = fixedDistance * 1.0; 
                controls.maxDistance = fixedDistance * 1.8;
                controls.update();
            },
            undefined,
            (error) => {
                loadingEl.style.display = 'none';
                alert("Model Load Failed! Check File Name in GitHub.");
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
