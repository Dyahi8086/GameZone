<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Cyberpunk Car</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e5e7eb; /* White background preserved */
            font-family: 'Orbitron', sans-serif;
            color: #000000;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            color: #000000;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .header p {
            font-size: clamp(0.7rem, 3vw, 1rem);
            font-weight: 700;
            color: #444444;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 0.8rem;
            font-weight: 700;
            color: #000000;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid #000000;
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .enter-btn:hover, .enter-btn:active {
            background: #000000;
            color: #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">Loading...</div>

    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p>Cyberpunk Experience</p>
        </div>
        
        <div class="bottom-section">
            <div class="hint">
                Drag to rotate · Pinch to zoom
            </div>
            <button class="enter-btn" id="enterBtn">Enter GameZone</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        // Background white (light grey) preserve kiya hai
        scene.background = new THREE.Color(0xe5e7eb); 

        // 🔥 FIX 8: Camera clipping (near/far) fix kiya
        // near 0.1 aur far 1000 kiya hai taaki zoom karte waqt model cut na ho
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // LIGHTS (Waisa hi rakha hai)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 4.0);
        topLight.position.set(0, 20, 0);
        topLight.castShadow = true;
        scene.add(topLight);

        const sideLight = new THREE.DirectionalLight(0xffffff, 3.0);
        sideLight.position.set(10, 10, 10);
        scene.add(sideLight);

        // CONTROLS SETUP
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        
        // 🔥 FIX 5: Pan ko band rakha hai taaki camera side mein na jaye
        controls.enablePan = false; 
        
        // Mobile touch smoothness
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN // Zoom in/out with 2 fingers
        };
        
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        
        // User touch kare toh auto-rotate band
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // LOAD MODEL
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const modelPath = './cyberpunk_car.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                // Material, Color, Design bilkul change nahi kiya (FIX 9)
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 2.0; 
                        }
                    }
                });

                // 🔥 FIX 2: Car ko center karne ka 100% pakka tarika
                // Car ko ek Group mein daala taaki uski position hamesha 0,0,0 rahe
                const carContainer = new THREE.Group();
                
                // Bounding box calculate karo
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                // Car ko shift karo taaki wo group ke exact center mein aaye
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;
                
                carContainer.add(model);
                scene.add(carContainer);

                // 🔥 FIX 3 & 4: Camera and Controls Target ko Center Lock karo
                const maxDim = Math.max(size.x, size.y, size.z);
                
                // Responsive camera distance (FIX 7)
                // Screen ke aspect ratio ke hisaab se camera doori calculate karo
                const fov = camera.fov * (Math.PI / 180);
                let distance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                // Mobile screen ke liye thoda aur door (1.8x)
                distance *= 1.8; 

                // Camera position set karo
                camera.position.set(distance * 0.5, distance * 0.4, distance * 0.8); 
                camera.lookAt(0, 0, 0);
                
                // Target ko center mein fix karo (Ye sabse important hai)
                controls.target.set(0, 0, 0);
                
                // 🔥 FIX 3: Zoom limits (minDistance aur maxDistance)
                // Car background mein na jaye isliye tight limits lagayi hain
                controls.minDistance = distance * 0.8; // Itne se zyada paas nahi aa sakta
                controls.maxDistance = distance * 1.5; // Itne se zyada door nahi ja sakta
                
                controls.update();

                // Floor Shadow
                const planeGeometry = new THREE.PlaneGeometry(100, 100);
                const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 }); 
                const shadowPlane = new THREE.Mesh(planeGeometry, planeMaterial);
                shadowPlane.rotation.x = -Math.PI / 2;
                shadowPlane.position.y = -size.y / 2 - 0.05; 
                shadowPlane.receiveShadow = true;
                scene.add(shadowPlane);
            },
            undefined,
            (error) => {
                loadingEl.style.display = 'none';
                alert("Model Load Failed! Check File.");
            }
        );

        document.getElementById('enterBtn').addEventListener('click', () => {
            alert("Welcome to GameZone!");
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // FIX 7: Screen resize par bhi camera adjust ho
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
