<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GAMEZONE — 3D Experience</title>  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e9e8e5;
      font-family: Arial, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .header {
      position: fixed;
      top: 24px;
      left: 22px;
      z-index: 2;
      pointer-events: none;
    }

    .logo {
      color: #252525;
      font-size: 35px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 8px;
      color: #555;
      font-size: 13px;
      letter-spacing: 4px;
      font-style: italic;
    }

    .hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      white-space: nowrap;
      padding: 15px 22px;
      border-radius: 40px;
      background: rgba(255,255,255,.9);
      color: #333;
      font-size: 13px;
      pointer-events: none;
    }

    #message {
      position: fixed;
      z-index: 3;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      text-align: center;
      color: #333;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
  </style></head><body>
  <div class="header">
    <div class="logo">GAMEZONE</div>
    <div class="subtitle">3D EXPERIENCE</div>
  </div><canvas id="scene"></canvas>

  <div class="hint">Drag to rotate · Pinch to zoom</div>
  <div id="message">Loading 3D model...</div>  <script type="module">
    const message = document.getElementById("message");

    async function start() {
      try {
        const THREE = await import(
          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        );

        const { GLTFLoader } = await import(
          "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
        );

        const { OrbitControls } = await import(
          "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
        );

        const canvas = document.getElementById("scene");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#e9e8e5");

        const camera = new THREE.PerspectiveCamera(
          35,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );

        const renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true
        });

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio || 1, 2)
        );

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.NoToneMapping;

        scene.add(
          new THREE.HemisphereLight(0xffffff, 0xbab6b0, 2)
        );

        const light1 = new THREE.DirectionalLight(0xffffff, 2.5);
        light1.position.set(5, 8, 6);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xffffff, 1.5);
        light2.position.set(-5, 4, -5);
        scene.add(light2);

        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(4, 80),
          new THREE.MeshStandardMaterial({
            color: "#d0cfcd",
            roughness: 1
          })
        );

        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.03;
        scene.add(ground);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.enableZoom = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1;
        controls.minDistance = 0.5;
        controls.maxDistance = 50;

        camera.position.set(4, 3, 6);

        const loader = new GLTFLoader();

        loader.load(
          "./character_fight.glb",

          function (gltf) {
            const model = gltf.scene;
            scene.add(model);

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxSize = Math.max(size.x, size.y, size.z);

            if (!Number.isFinite(maxSize) || maxSize <= 0) {
              message.textContent =
                "Model file mein valid 3D geometry nahi mili.";
              return;
            }

            // Scale model to fit the screen without changing its materials.
            const scale = 2.5 / maxSize;
            model.scale.setScalar(scale);

            const scaledBox = new THREE.Box3().setFromObject(model);
            const scaledCenter = scaledBox.getCenter(new THREE.Vector3());

            model.position.x -= scaledCenter.x;
            model.position.z -= scaledCenter.z;
            model.position.y -= scaledBox.min.y;

            const finalBox = new THREE.Box3().setFromObject(model);
            const finalSize = finalBox.getSize(new THREE.Vector3());
            const height = Math.max(finalSize.y, 0.5);

            ground.scale.setScalar(
              Math.max(finalSize.x, finalSize.z, height) * 1.5
            );

            controls.target.set(0, height * 0.45, 0);
            camera.position.set(
              height * 1.5,
              height * 1.0,
              height * 2.8
            );

            controls.minDistance = height * 0.6;
            controls.maxDistance = height * 8;
            controls.update();

            message.style.display = "none";
          },

          function (xhr) {
            if (xhr.total > 0) {
              const percent = Math.round(
                (xhr.loaded / xhr.total) * 100
              );
              message.textContent = "Loading 3D model... " + percent + "%";
            }
          },

          function (error) {
            console.error("GLB loading error:", error);
            message.textContent =
              "Model load nahi hua. File ka naam, format aur browser console check karna hoga.";
          }
        );

        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", function () {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

      } catch (error) {
        console.error(error);
        message.textContent =
          "3D engine load nahi hua. Internet connection check karke page refresh karo.";
      }
    }

    start();
  </script></body>
</html>
