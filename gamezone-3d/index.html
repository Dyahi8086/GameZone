<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameZone - 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            touch-action: none;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 
                         0 0 20px rgba(0, 255, 255, 0.6), 
                         0 0 40px rgba(0, 255, 255, 0.4);
        }

        .header p {
            font-size: 0.9rem;
            font-weight: 600;
            color: #a0a0a0;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }

        .hint {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e5e7eb;
            background: rgba(20, 20, 20, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 20;
            text-align: center;
            max-width: 90%;
        }

        #loading {
            background: rgba(10, 10, 10, 0.9);
            color: #00ffff;
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        #error {
            background: rgba(50, 10, 10, 0.9);
            color: #f87171;
            border: 1px solid #b91c1c;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p>3D Experience</p>
        </div>
        <div class="hint">
            Drag to rotate · Pinch to zoom
        </div>
    </div>

    <div id="loading">Loading Experience...</div>
    <div id="error"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1, 5);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false,
            powerPreference: "high-performance" 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        // EXPOSURE BADHAYA HAI TAAKI MODEL BRIGHT DIKHE
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        
        document.body.appendChild(renderer.domElement);

        // Lighting
        // Ambient light badha di hai taaki original colors pop ho
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
        keyLight.position.set(5, 10, 7);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);

        // Side lights
        const leftLight = new THREE.DirectionalLight(0xffffff, 1.5);
        leftLight.position.set(-5, 5, 5);
        scene.add(leftLight);

        // Neon lights thodi aur bright kar di hain
        const cyanLight = new THREE.PointLight(0x00ffff, 50, 20);
        cyanLight.position.set(-4, 2, 3);
        scene.add(cyanLight);

        const magentaLight = new THREE.PointLight(0xff00ff, 50, 20);
        magentaLight.position.set(4, 1, -2);
        scene.add(magentaLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.enablePan = false; 
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0; 
        
        controls.addEventListener('start', () => {
            controls.autoRotate = false;
        });

        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');

        const modelPath = './character_fight.glb';

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Agar model bahut dark hai, toh material ko thoda bright kar sakte hain (Optional)
                        if(child.material) {
                            child.material.toneMapped = false; // Isse colors aur bright dikhenge
                        }
                    }
                });

                scene.add(model);

                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                cameraZ *= 1.1; 

                camera.position.set(0, 0, cameraZ);
                camera.lookAt(0, 0, 0);

                controls.target.set(0, 0, 0);
                controls.update();

                if (gltf.animations && gltf.animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();

                    const clock = new THREE.Clock();
                    function animateMixer() {
                        requestAnimationFrame(animateMixer);
                        mixer.update(clock.getDelta());
                    }
                    animateMixer();
                }
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.textContent = `Loading... ${percent}%`;
                }
            },
            (error) => {
                console.error('Error loading GLB model:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = `Failed to load model.\n\nPlease check if "${modelPath}" exists.`;
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
