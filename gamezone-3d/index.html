<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Cyberpunk Showroom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111111; /* Dark Studio Grey */
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh; 
            z-index: 1;
            /* Ekdum subtle gradient taaki 3D scene real lage */
            background: radial-gradient(circle at center, #2a2a2a 0%, #050505 100%);
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }

        /* Text wapas Cyan/White kar diya taaki studio background pe premium lage */
        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        .header p {
            font-size: clamp(0.7rem, 3vw, 1rem);
            font-weight: 700;
            color: #00ffff;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e5e7eb;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #00ffff;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .enter-btn:hover, .enter-btn:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 40px #00ffff;
            transform: scale(1.05);
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .loader-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00ffff;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ffff;
        }

        .progress-bar-container {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #0088ff);
            box-shadow: 0 0 15px #00ffff;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-text">LOADING SHOWROOM...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p>Cyberpunk Experience</p>
        </div>
        
        <div class="bottom-section">
            <div class="hint">
                Drag to rotate · Pinch to zoom
            </div>
            <button class="enter-btn" id="enterBtn">Enter GameZone</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        // Scene ka background transparent rakha hai taaki CSS ka gradient dikhe
        scene.background = null; 
        
        // Fog se depth aati hai
        scene.fog = new THREE.FogExp2(0x111111, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Studio Environment (Isse black car par white lines/chamak aati hai)
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // --- STUDIO LIGHTING (Photo jaisa look) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        // Top Light (Car ke roof aur bonnet par shine ke liye)
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 20, 0);
        topLight.castShadow = true;
        topLight.shadow.mapSize.width = 1024;
        topLight.shadow.mapSize.height = 1024;
        scene.add(topLight);

        // Side Lights (Car ke shape ko highlight karne ke liye)
        const sideLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        sideLight1.position.set(-10, 10, 5);
        scene.add(sideLight1);

        const sideLight2 = new THREE.DirectionalLight(0xffffff, 1.5);
        sideLight2.position.set(10, 10, -5);
        scene.add(sideLight2);


        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // --- LOAD MODEL ---
        const loader = new GLTFLoader();
        const progressBar = document.getElementById('progress-bar');
        const loadingScreen = document.getElementById('loading-screen');
        const modelPath = './cyberpunk_car.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

                const model = gltf.scene;

                // HD Textures & Shadows enable
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 2.5; // Reflection badhaya
                        }
                    }
                });

                scene.add(model);

                // --- CENTER & FIT CAR ---
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                // Perfect Showroom Camera Angle
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim * 1.8, maxDim * 0.6, maxDim * 1.8); 
                camera.lookAt(0, 0, 0);
                
                controls.target.set(0, 0, 0);
                controls.minDistance = maxDim * 1.5; 
                controls.maxDistance = maxDim * 3.5;
                controls.update();

                // --- INVISIBLE FLOOR FOR SHADOW ---
                // Photo jaisa shadow niche daalne ke liye
                const planeGeometry = new THREE.PlaneGeometry(maxDim * 10, maxDim * 10);
                const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.5 }); 
                const shadowPlane = new THREE.Mesh(planeGeometry, planeMaterial);
                shadowPlane.rotation.x = -Math.PI / 2;
                shadowPlane.position.y = -size.y / 2 - 0.05; 
                shadowPlane.receiveShadow = true;
                scene.add(shadowPlane);
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = (xhr.loaded / xhr.total) * 100;
                    progressBar.style.width = percent + '%';
                }
            },
            (error) => {
                loadingScreen.style.display = 'none';
                alert("Model Load Failed!");
            }
        );

        document.getElementById('enterBtn').addEventListener('click', () => {
            alert("Welcome to GameZone! Games section coming soon...");
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
