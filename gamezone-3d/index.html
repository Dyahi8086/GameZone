<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Premium Experience</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* ========================================= */
        /* --- 1. CUTE DUCK LOADING ANIMATION --- */
        /* ========================================= */
        #intro-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #e5e7eb; /* Light grey background matching the duck image */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        
        #intro-loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        /* Duck Scene Setup */
        .duck-scene {
            position: relative;
            width: 300px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }

        /* The Water Line */
        .water-line {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 10px;
            background-color: #4cd4d4; /* Cyan water color */
            border-radius: 10px;
            z-index: 1;
        }

        /* Duck Container */
        .duck-container {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 40px; /* Space between ducks */
        }

        /* Individual Duck Styling */
        .duck {
            width: 60px;
            height: 50px;
            position: relative;
            animation: float 2s ease-in-out infinite;
        }

        /* Duck Body */
        .duck-body {
            width: 100%;
            height: 100%;
            background-color: #ffd700; /* Yellow */
            border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
            position: absolute;
            bottom: 0;
        }

        /* Duck Head */
        .duck-head {
            width: 35px;
            height: 35px;
            background-color: #ffd700;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            right: 5px;
        }

        /* Duck Eye */
        .duck-eye {
            width: 6px;
            height: 6px;
            background-color: #000;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            right: 10px;
        }

        /* Duck Beak */
        .duck-beak {
            width: 15px;
            height: 8px;
            background-color: #ff4500; /* Orange/Red */
            border-radius: 0 50% 50% 0;
            position: absolute;
            top: 15px;
            right: -10px;
        }

        /* Duck Tail */
        .duck-tail {
            width: 15px;
            height: 20px;
            background-color: #ffd700;
            border-radius: 50% 0 0 50%;
            position: absolute;
            bottom: 10px;
            left: -5px;
            transform: rotate(-20deg);
        }

        /* Animation for floating ducks */
        .duck:nth-child(1) { animation-delay: 0s; }
        .duck:nth-child(2) { animation-delay: 0.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Bubbles */
        .bubbles {
            position: absolute;
            bottom: 30px;
            left: 20px;
            z-index: 3;
        }

        .bubble {
            position: absolute;
            background-color: transparent;
            border: 2px solid #4cd4d4;
            border-radius: 50%;
            animation: rise 2s infinite ease-in;
        }

        .bubble:nth-child(1) { width: 15px; height: 15px; left: 0; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 8px; height: 8px; left: 20px; animation-delay: 0.5s; }
        .bubble:nth-child(3) { width: 10px; height: 10px; left: 10px; animation-delay: 1s; }
        .bubble:nth-child(4) { width: 5px; height: 5px; left: 30px; animation-delay: 1.5s; }

        @keyframes rise {
            0% { bottom: 30px; opacity: 1; transform: scale(1); }
            100% { bottom: 100px; opacity: 0; transform: scale(1.5); }
        }

        /* ========================================= */
        /* --- 2. HOME SCREEN (3D MODEL) --- */
        /* ========================================= */
        #home-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 10;
            background-color: #f3f4f6;
        }

        #home-screen.hidden {
            opacity: 0;
            transform: scale(1.05); 
            pointer-events: none;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #000;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .enter-btn:hover, .enter-btn:active { 
            background: #000; 
            color: #ff69b4; 
            box-shadow: 0 0 30px #ff69b4; 
            transform: scale(1.05);
        }

        /* ========================================= */
        /* --- 3. PREMIUM DASHBOARD SCREEN --- */
        /* ========================================= */
        #dashboard-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #0b0c10; 
            background-image: radial-gradient(circle at 50% 0%, #1f2330 0%, #050505 80%);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
            overflow-y: auto;
        }

        #dashboard-screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(11, 12, 16, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        
        .back-btn {
            background: transparent; color: #00ffff; border: 1px solid #00ffff;
            padding: 8px 20px; border-radius: 4px; font-family: 'Orbitron', sans-serif;
            cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .back-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }

        /* Hero Banner */
        .hero-banner {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 250px;
            margin: 30px auto;
            background: linear-gradient(135deg, #e2e8f0 0%, #ffffff 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .hero-banner h1 {
            font-size: 4rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px #3b82f6;
            opacity: 0.2;
            position: absolute;
            letter-spacing: 10px;
            white-space: nowrap;
        }
        .hero-character {
            position: absolute;
            bottom: 0;
            right: 10%;
            height: 110%;
            background-size: contain;
            background-position: bottom;
            background-repeat: no-repeat;
            filter: drop-shadow(-10px 0 20px rgba(0,0,0,0.3));
        }

        /* 3D Cards Grid */
        .section-title {
            text-align: center;
            margin: 40px 0 20px;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            padding: 20px 40px 80px;
            max-width: 1100px;
            margin: 0 auto;
            perspective: 1200px;
        }

        .game-card {
            position: relative;
            height: 320px;
            border-radius: 15px;
            background: #15171e;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            transform-style: preserve-3d;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .game-card:hover {
            transform: translateY(-10px) rotateX(8deg) rotateY(-8deg) scale(1.05);
            box-shadow: -15px 20px 50px rgba(255, 0, 85, 0.4);
            border-color: #ff0055;
        }

        .card-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
            opacity: 0.8;
        }
        .game-card:hover .card-img {
            transform: scale(1.1);
            opacity: 1;
        }

        .card-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 70%;
            background: linear-gradient(to top, #0b0c10 10%, rgba(11,12,16,0.8) 50%, transparent);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 5px;
            color: #fff;
            text-transform: uppercase;
            transform: translateZ(30px);
        }
        .game-category {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: #00ffff;
            font-weight: 700;
            letter-spacing: 1px;
            transform: translateZ(20px);
        }

        .play-action {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ff0055;
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: 0.3s;
            z-index: 10;
            box-shadow: 0 0 20px #ff0055;
        }
        .game-card:hover .play-action {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 768px) {
            .hero-banner { height: 180px; }
            .hero-banner h1 { font-size: 2.5rem; }
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 10px 15px 50px; }
            .game-card { height: 220px; border-radius: 10px; }
            .game-title { font-size: 1rem; }
            .game-category { font-size: 0.8rem; }
            .card-overlay { padding: 10px; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0c10; }
        ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 4px; }
    </style>
</head>
