<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GameZone - Cyberpunk Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f2f5; /* White/Light background preserved */
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }
        .header {
            text-align: center;
            margin-top: 15px;
        }
        .header h1 {
            font-size: 28px;
            letter-spacing: 4px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        .header p {
            font-size: 12px;
            letter-spacing: 2px;
            color: #333;
            margin-top: 5px;
        }
        .footer-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            pointer-events: auto;
        }
        .instructions {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #111;
        }
        .enter-btn {
            background: #ffffff;
            border: 2px solid #000;
            padding: 12px 40px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .enter-btn:hover {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="webgl-container"></div>

    <!-- UI Overlay -->
    <div class="ui-container">
        <div class="header">
            <h1>GAMEZONE</h1>
            <p>CYBERPUNK EXPERIENCE</p>
        </div>

        <div class="footer-ui">
            <div class="instructions">Drag to rotate . Pinch to zoom</div>
            <button class="enter-btn" onclick="enterGameZone()">ENTER GAMEZONE</button>
        </div>
    </div>

    <!-- Three.js and Loaders CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, carModel;

        function init() {
            const container = document.getElementById('webgl-container');

            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f2f5);

            // 2. Camera Setup with proper Near/Far planes to prevent clipping
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 6);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls Setup with min/max distance limits
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2.5;  // Zoom in limit (prevents going inside model/camera flip)
            controls.maxDistance = 12.0; // Zoom out limit (prevents going into background)
            controls.maxPolarAngle = Math.PI / 2 + 0.05; // Prevent camera going below ground
            controls.enablePan = false; // Disable panning to keep car centered

            // 5. Lighting (Preserves original car color & materials without altering design)
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.8);
            backLight.position.set(-5, -5, -5);
            scene.add(backLight);

            // 6. Load GLTF Car Model
            const loader = new THREE.GLTFLoader();
            // Yahan apni car model ki file ka path check kar lein (e.g., 'car.gltf' ya 'scene.gltf')
            loader.load('car.gltf', function (gltf) {
                carModel = gltf.scene;

                // Compute bounding box to perfectly center and scale model responsively
                const box = new THREE.Box3().setFromObject(carModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // Center the model at origin
                carModel.position.x -= center.x;
                carModel.position.y -= center.y;
                carModel.position.z -= center.z;

                // Responsive auto-scaling based on screen size
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 3.5 / maxDim;
                carModel.scale.setScalar(scaleFactor);

                scene.add(carModel);

                // Set OrbitControls target to center of the car model
                controls.target.set(0, 0, 0);
                controls.update();

            }, undefined, function (error) {
                console.error('An error happened while loading the model:', error);
            });

            // Window Resize Handler
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function enterGameZone() {
            // Aapka existing game entry logic yahan rahega
            alert("Entering GameZone...");
        }

        init();
        animate();
    </script>
</body>
</html>
