<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Red Cyberpunk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050000; 
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 20px;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 50px #ff0000;
        }

        .header p {
            font-size: clamp(0.7rem, 3vw, 1rem);
            font-weight: 700;
            color: #ff4444;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 0.8rem;
            font-weight: 700;
            color: #e5e7eb;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ff3333;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #ff3333;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3), inset 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .enter-btn:hover, .enter-btn:active {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 40px #ff0000, inset 0 0 20px #ffffff;
            transform: scale(1.05);
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .loader-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff3333;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }

        .progress-bar-container {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 0, 0.5);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #880000, #ff0000);
            box-shadow: 0 0 15px #ff0000;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-text">LOADING RED PROTOCOL...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p style="color: #ff4444;">Red Cyberpunk</p>
        </div>
        
        <div class="bottom-section">
            <div class="hint">
                Drag to rotate · Pinch to zoom
            </div>
            <button class="enter-btn" id="enterBtn">Enter GameZone</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // LIGHTS
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); 
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 2.0);
        topLight.position.set(0, 20, 0);
        topLight.castShadow = true;
        scene.add(topLight);

        const redLight1 = new THREE.PointLight(0xff0000, 300, 50);
        redLight1.position.set(-10, 5, 5);
        scene.add(redLight1);

        const redLight2 = new THREE.PointLight(0xff0000, 300, 50);
        redLight2.position.set(10, 5, -5);
        scene.add(redLight2);

        // CONTROLS
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // LOAD MODEL
        const loader = new GLTFLoader();
        const progressBar = document.getElementById('progress-bar');
        const loadingScreen = document.getElementById('loading-screen');
        const modelPath = './cyberpunk_car.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);

                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 2.0; 
                        }
                    }
                });

                scene.add(model);

                // CENTER THE CAR
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                // 🔥 CAMERA FIX (Zoom Out & Fit perfectly)
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let distance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                // Camera ko aur door kiya (2.5x) taaki car mobile screen mein poori aaye
                distance *= 2.5; 

                // Camera ko thoda upar aur side se set kiya
                camera.position.set(distance * 0.8, distance * 0.4, distance * 0.8);
                camera.lookAt(0, 0, 0);
                
                controls.target.set(0, 0, 0);
                
                // Zoom limits taaki car screen se bahar na jaye
                controls.minDistance = maxDim * 0.8; 
                controls.maxDistance = maxDim * 4.0;

                controls.update();

                // 🔥 FLOOR FIX (Niche ka Red effect)
                const glowGeo = new THREE.PlaneGeometry(maxDim * 4, maxDim * 4);
                const glowMat = new THREE.MeshBasicMaterial({ 
                    color: 0x330000, 
                    transparent: true, 
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending 
                });
                const glowFloor = new THREE.Mesh(glowGeo, glowMat);
                glowFloor.rotation.x = -Math.PI / 2;
                // Floor ko car ke bilkul niche set kiya
                glowFloor.position.y = -size.y / 2 - 0.1; 
                scene.add(glowFloor);
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = (xhr.loaded / xhr.total) * 100;
                    progressBar.style.width = percent + '%';
                }
            },
            (error) => {
                loadingScreen.style.display = 'none';
                alert("Model Load Failed!");
            }
        );

        document.getElementById('enterBtn').addEventListener('click', () => {
            alert("Welcome to GameZone! Games section coming soon...");
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
