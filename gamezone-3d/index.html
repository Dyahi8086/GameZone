<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAMENOVA — Car Reveal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070d;color:white;font-family:Arial,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 35%,#05070dee)}
header{position:fixed;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;letter-spacing:3px;font-size:12px}
.logo b{color:#7df7ff}
.hero{position:fixed;top:12%;width:100%;text-align:center;padding:0 12px;pointer-events:none}
.tag{font-size:10px;letter-spacing:4px;color:#7df7ff}
h1{font-size:clamp(30px,8vw,62px);margin:15px 0;letter-spacing:3px}
p{font-size:12px;color:#bbc6d6}
.bottom{position:fixed;bottom:25px;width:100%;text-align:center}
button{background:#07121b;border:1px solid #7df7ff;color:white;padding:15px 25px;letter-spacing:2px;font-weight:bold}
.hint{font-size:10px;color:#aab4c5;margin-top:14px;letter-spacing:2px}
#status{position:fixed;bottom:100px;left:10px;right:10px;text-align:center;font-size:12px;color:#7df7ff}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div class="shade"></div>

<header>
<div class="logo"><b>◆</b> GAMENOVA</div>
<div>● WORLD ONLINE</div>
</header>

<section class="hero">
<div class="tag">NEXT-GEN GARAGE</div>
<h1>THE <span style="color:#7df7ff">REVEAL</span></h1>
<p>A machine hidden in shadow.</p>
</section>

<div id="status">Loading 3D car...</div>

<div class="bottom">
<button id="reveal">REVEAL THE MACHINE</button>
<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const canvas=document.getElementById('scene');

const renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070d);
scene.fog=new THREE.Fog(0x05070d,12,35);

const camera=new THREE.PerspectiveCamera(
 40,innerWidth/innerHeight,0.1,1000
);
camera.position.set(5,3,8);

scene.add(new THREE.HemisphereLight(0xc9e5ff,0x11111a,2));

function light(color,power,x,y,z){
 const l=new THREE.DirectionalLight(color,power);
 l.position.set(x,y,z);
 scene.add(l);
}

light(0xffffff,4,4,7,5);
light(0x7df7ff,3,-5,4,-4);
light(0xffd4a0,2,2,3,-7);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({
  color:0x090d15,
  metalness:0.5,
  roughness:0.3
 })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.05;
scene.add(floor);

const grid=new THREE.GridHelper(40,60,0x183247,0x101b2a);
grid.position.y=-0.04;
scene.add(grid);

function strip(x,y,z,sx,sy,sz){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),
  new THREE.MeshBasicMaterial({color:0x8ceeff})
 );
 m.position.set(x,y,z);
 scene.add(m);
}

strip(-4,4,-2,0.06,5,0.08);
strip(4,4,-2,0.06,5,0.08);
strip(0,6,-3,8,0.05,0.08);

const pivot=new THREE.Group();
scene.add(pivot);

let car=null;
let cover=null;
let revealed=false;
let dragging=false;
let lastX=0;
let lastY=0;
let rotation=0;

const status=document.getElementById('status');

new GLTFLoader().load(
 './racecar_sport_car.glb',

 function(gltf){
  car=gltf.scene;

  const box=new THREE.Box3().setFromObject(car);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const max=Math.max(size.x,size.y,size.z);

  if(max===0){
   status.textContent='Model size error';
   return;
  }

  const scale=4.5/max;
  car.scale.setScalar(scale);
  car.position.sub(center.multiplyScalar(scale));

  const scaledBox=new THREE.Box3().setFromObject(car);
  car.position.y-=scaledBox.min.y;

  pivot.add(car);

  const b=new THREE.Box3().setFromObject(car);
  const s=b.getSize(new THREE.Vector3());
  const c=b.getCenter(new THREE.Vector3());

  // Simple dome-like cover for the reveal effect.
  cover=new THREE.Mesh(
   new THREE.SphereGeometry(1,40,24,0,Math.PI*2,0,Math.PI/2),
   new THREE.MeshPhysicalMaterial({
    color:0x182434,
    metalness:0.2,
    roughness:0.35,
    transparent:true,
    opacity:0.97,
    side:THREE.DoubleSide
   })
  );

  cover.scale.set(
   Math.max(s.x*0.65,1),
   Math.max(s.y*1.8,1),
   Math.max(s.z*0.7,1)
  );

  cover.position.set(
   c.x,
   Math.max(s.y*0.6,0.8),
   c.z
  );

  pivot.add(cover);

  camera.position.set(5,Math.max(2.5,s.y*1.3),8);
  camera.lookAt(0,0.7,0);

  status.textContent='3D CAR LOADED SUCCESSFULLY';
 },

 undefined,

 function(error){
  console.error(error);
  status.textContent=
  'Car load failed. Check GLB filename and file location.';
 }
);

document.getElementById('reveal').onclick=function(){
 if(!cover){
  status.textContent='Please wait for the car to load.';
  return;
 }

 revealed=!revealed;
 cover.visible=!revealed;

 this.textContent=revealed?
 'SHOW COVER AGAIN':'REVEAL THE MACHINE';

 status.textContent=revealed?
 'THE MACHINE IS REVEALED':'THE CAR IS COVERED';
};

canvas.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
 canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

canvas.addEventListener('pointermove',e=>{
 if(!dragging)return;

 rotation+=(e.clientX-lastX)*0.008;
 camera.position.y=Math.max(
  0.8,
  Math.min(6,camera.position.y-(e.clientY-lastY)*0.008)
 );

 lastX=e.clientX;
 lastY=e.clientY;
});

canvas.addEventListener('wheel',e=>{
 camera.position.z=Math.max(
  4,
  Math.min(14,camera.position.z+e.deltaY*0.008)
 );
},{passive:true});

function animate(){
 requestAnimationFrame(animate);
 pivot.rotation.y+=(rotation-pivot.rotation.y)*0.08;
 renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>

</body>
</html>
