<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Cyberpunk Car</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #e5e7eb; /* White/Grey */
            font-family: 'Orbitron', sans-serif;
            color: #000000;
            overflow: hidden;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh; 
            z-index: 1;
        }
        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }
        .header { text-align: center; margin-top: 20px; }
        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }
        .header p {
            font-size: clamp(0.7rem, 3vw, 1rem);
            font-weight: 700;
            color: #444;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .hint {
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #000;
            pointer-events: auto;
        }
        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .enter-btn:hover { background: #000; color: #00ffff; box-shadow: 0 0 20px #00ffff; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">Loading...</div>

    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p>Cyberpunk Experience</p>
        </div>
        <div class="bottom-section">
            <div class="hint">Drag to rotate · Pinch to zoom</div>
            <button class="enter-btn" id="enterBtn">Enter GameZone</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe5e7eb); 

        // Standard Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 20, 0);
        scene.add(topLight);
        
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.enablePan = false; 

        // Load Model
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        
        loader.load('./cyberpunk_car.glb', (gltf) => {
            loadingEl.style.display = 'none';
            const model = gltf.scene;
            
            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.toneMapped = false; 
                }
            });

            // 1. MODEL KO SCENE MEIN DAALA
            scene.add(model);

            // 2. BOUNDING BOX SE CENTER NIKALA
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            // 3. MODEL KO EXACT CENTER PAR SHIFT KIYA
            model.position.x = -center.x;
            model.position.y = -center.y;
            model.position.z = -center.z;

            // 4. CAMERA KO FIXED DOORI PAR SET KIYA (Ye guarantee hai ki car dikhegi)
            // Car ke size ka 3 guna door
            const maxSize = Math.max(size.x, size.y, size.z);
            const distance = maxSize * 3.0;

            camera.position.set(distance, distance * 0.5, distance);
            camera.lookAt(0, 0, 0);

            // 5. ZOOM LOCK (Car na door jayegi na andar)
            controls.target.set(0, 0, 0);
            controls.minDistance = distance * 0.8; // Paas aane ki limit
            controls.maxDistance = distance * 1.2; // Door jaane ki limit
            
            controls.update();

            // 6. CAR AUTO-ROTATE
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.5;
            controls.addEventListener('start', () => { controls.autoRotate = false; });

        }, undefined, (error) => {
            loadingEl.style.display = 'none';
            alert("Car model load nahi hui. Check karo file ka naam sahi hai.");
        });

        document.getElementById('enterBtn').addEventListener('click', () => {
            alert("Welcome to GameZone!");
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
