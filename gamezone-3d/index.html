<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameZone - Cyberpunk Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page scroll enable kar diya hai */
        body {
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            /* touch-action: none;  <- Ise hata diya taaki page scroll ho sake */
        }

        /* 3D Canvas Section */
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh; /* Car poori screen par dikhegi */
            overflow: hidden;
        }

        /* UI Overlay */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        /* GAMEZONE Text */
        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 
                         0 0 20px rgba(0, 255, 255, 0.6), 
                         0 0 40px rgba(0, 255, 255, 0.4);
        }

        .header p {
            font-size: 0.9rem;
            font-weight: 600;
            color: #a0a0a0;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }

        .hint {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e5e7eb;
            background: rgba(20, 20, 20, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        /* Loading & Error */
        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 20;
            text-align: center;
            max-width: 90%;
        }

        #loading {
            background: rgba(10, 10, 10, 0.9);
            color: #00ffff;
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        #error {
            background: rgba(50, 10, 10, 0.9);
            color: #f87171;
            border: 1px solid #b91c1c;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Niche scroll karne ke liye thoda space (Testing ke liye) */
        .next-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: #555;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Car Section -->
    <div id="canvas-container">
        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
                <p>Cyberpunk Experience</p>
            </div>
            <div class="hint">
                Drag to rotate · Scroll/Pinch to zoom
            </div>
        </div>

        <div id="loading">Loading Car...</div>
        <div id="error"></div>
    </div>

    <!-- Niche ka page (Testing ke liye ki scroll chal raha hai) -->
    <div class="next-section">
        ↓ Scroll Down for Games ↓
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1, 5);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        
        // Canvas ko container ke andar daala
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. Lighting (Cyberpunk Vibe)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
        keyLight.position.set(5, 10, 7);
        scene.add(keyLight);

        // Neon Lights (Car ke colors ko pop karne ke liye)
        const cyanLight = new THREE.PointLight(0x00ffff, 60, 25);
        cyanLight.position.set(-5, 2, 5);
        scene.add(cyanLight);

        const magentaLight = new THREE.PointLight(0xff00ff, 60, 25);
        magentaLight.position.set(5, 2, -5);
        scene.add(magentaLight);

        // 5. Controls (Zoom aur Rotate fix)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; // Car ko screen se bahar jaane se rokega
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        
        // Auto rotate car ke liye (shuru mein)
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        
        controls.addEventListener('start', () => {
            controls.autoRotate = false; // Jab user touch kare toh ghoomna band
        });

        // 6. Model Loading (CYBERPUNK CAR)
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        
        // TUMHARI NAYI CAR FILE KA NAAM YAHAN HAI
        const modelPath = './cyberpunk_car.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Original colors ko preserve karne ke liye
                        if(child.material) {
                            child.material.toneMapped = false; 
                        }
                    }
                });

                scene.add(model);

                // --- AUTO CENTER & FIT (Car ke hisaab se) ---
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // Car ko center mein laao
                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                // Car ka size calculate karke camera ko set karo
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                // Car lambi hoti hai, isliye padding thodi badha di (1.4) taaki poori fit ho
                cameraZ *= 1.4; 

                camera.position.set(0, 1, cameraZ); // Thoda upar se car dekhne ke liye
                camera.lookAt(0, 0, 0);

                controls.target.set(0, 0, 0);
                controls.update();

                // Animations (Agar car mein koi animation hai)
                if (gltf.animations && gltf.animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                    const clock = new THREE.Clock();
                    function animateMixer() {
                        requestAnimationFrame(animateMixer);
                        mixer.update(clock.getDelta());
                    }
                    animateMixer();
                }
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.textContent = `Loading Car... ${percent}%`;
                }
            },
            (error) => {
                console.error('Error:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = `Car load nahi hui. Check karo "${modelPath}" GitHub par upload hai ya nahi.`;
            }
        );

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // 8. Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
