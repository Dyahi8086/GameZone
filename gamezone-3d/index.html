<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameNova | 3D Car Garage</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#05070b;color:white;
  font-family:Arial,Helvetica,sans-serif
}
#scene{position:fixed;inset:0;width:100%;height:100%;
  display:block;touch-action:none}
header{
  position:fixed;top:0;left:0;right:0;
  padding:20px;display:flex;justify-content:space-between;
  font-size:12px;letter-spacing:3px;color:#9af5ff;
  pointer-events:none
}
.hero{
  position:fixed;top:12%;left:0;width:100%;
  text-align:center;pointer-events:none
}
.tag{font-size:9px;letter-spacing:4px;color:#7df7ff}
h1{font-size:clamp(30px,8vw,54px);margin:12px 0;
  font-style:italic}
h1 span{color:#7df7ff}
p{font-size:12px;color:#c8d5df}
#status{
  position:fixed;bottom:75px;left:10px;right:10px;
  text-align:center;font-size:12px;color:#9af5ff;
  text-shadow:0 0 10px #00d9ff
}
.bottom{
  position:fixed;bottom:18px;left:0;right:0;
  text-align:center;font-size:10px;letter-spacing:2px;
  color:#c7d6df;pointer-events:none
}
button{
  position:fixed;bottom:105px;left:50%;
  transform:translateX(-50%);
  padding:14px 22px;background:#08151c;
  border:1px solid #7df7ff;color:white;
  letter-spacing:2px;font-weight:bold;
  border-radius:3px
}
</style>
</head>

<body>
<canvas id="scene"></canvas>

<header>
  <b>✦ GAMENOVA</b>
  <b>• 3D GARAGE</b>
</header>

<section class="hero">
  <div class="tag">CINEMATIC AUTOMOTIVE EXPERIENCE</div>
  <h1>THE <span>MACHINE</span></h1>
  <p>One car. Dark studio. Pure detail.</p>
</section>

<div id="status">Loading 3D car...</div>
<button id="reset">RESET CAMERA</button>
<div class="bottom">DRAG TO ROTATE · PINCH OR SCROLL TO ZOOM</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const canvas = document.getElementById('scene');
const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.Fog(0x05070b, 18, 45);

const camera = new THREE.PerspectiveCamera(
  38, window.innerWidth/window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:true,
  alpha:false,
  powerPreference:'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

scene.add(new THREE.HemisphereLight(0xddeeff,0x151820,2.2));

function light(color,power,x,y,z){
  const l = new THREE.DirectionalLight(color,power);
  l.position.set(x,y,z);
  scene.add(l);
}

light(0xffffff,4,4,8,5);
light(0x7df7ff,3,-5,4,-4);
light(0xffd7ad,2,2,3,7);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({
    color:0x090d13,
    metalness:0.55,
    roughness:0.32
  })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.04;
scene.add(floor);

const grid = new THREE.GridHelper(40,60,0x183247,0x101824);
grid.position.y=-0.025;
scene.add(grid);

// Studio light strips
function strip(x,y,z,sx,sy,sz){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    new THREE.MeshBasicMaterial({color:0x8ceeff})
  );
  m.position.set(x,y,z);
  scene.add(m);
}
strip(-4,4,-4,0.05,0.05,8);
strip(4,4,-4,0.05,0.05,8);
strip(0,6,-5,7,0.05,0.05);

const carGroup = new THREE.Group();
scene.add(carGroup);

let car = null;
let rotation = 0;
let targetRotation = 0;
let zoom = 8;
let targetZoom = 8;
let drag = false;
let lastX = 0;
let lastY = 0;
let targetY = 1.1;

camera.position.set(5,3,zoom);
camera.lookAt(0,targetY,0);

const loader = new GLTFLoader();

loader.load(
  './cartoon_sports_car.glb',

  function(gltf){
    car = gltf.scene;

    // Model ka size automatically set karo
    const box = new THREE.Box3().setFromObject(car);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxSize = Math.max(size.x,size.y,size.z);

    if(!Number.isFinite(maxSize) || maxSize<=0){
      status.textContent='Invalid 3D model.';
      return;
    }

    const scale = 4.5/maxSize;
    car.scale.setScalar(scale);

    // Car ko center mein aur floor ke upar rakho
    car.position.set(
      -center.x*scale,
      -box.min.y*scale,
      -center.z*scale
    );

    car.traverse(function(obj){
      if(obj.isMesh){
        obj.frustumCulled=false;
        if(obj.material){
          obj.material.needsUpdate=true;
        }
      }
    });

    carGroup.add(car);

    targetY=0.9;
    zoom=8;
    targetZoom=8;

    status.textContent='3D CAR LOADED — DRAG TO ROTATE';

    setTimeout(function(){
      status.style.display='none';
    },5000);
  },

  function(xhr){
    if(xhr.total>0){
      status.textContent='Loading car: '+
        Math.round(xhr.loaded/xhr.total*100)+'%';
    }
  },

  function(error){
    console.error('Car loading error:',error);
    status.style.display='block';
    status.textContent=
      'Car failed to load. Check the GLB file and internet.';
  }
);

// Touch aur mouse se car ghumao
canvas.addEventListener('pointerdown',function(e){
  drag=true;
  lastX=e.clientX;
  lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointerup',function(){
  drag=false;
});

canvas.addEventListener('pointercancel',function(){
  drag=false;
});

canvas.addEventListener('pointermove',function(e){
  if(!drag)return;

  targetRotation+=(e.clientX-lastX)*0.008;
  targetY=Math.max(0.2,Math.min(3,
    targetY-(e.clientY-lastY)*0.008));

  lastX=e.clientX;
  lastY=e.clientY;
});

canvas.addEventListener('wheel',function(e){
  targetZoom=Math.max(5,Math.min(15,
    targetZoom+e.deltaY*0.008));
},{passive:true});

document.getElementById('reset').addEventListener('click',function(){
  targetRotation=0;
  targetY=0.9;
  targetZoom=8;
});

function animate(){
  requestAnimationFrame(animate);

  carGroup.rotation.y +=
    (targetRotation-carGroup.rotation.y)*0.08;

  zoom+=(targetZoom-zoom)*0.08;

  camera.position.set(
    Math.sin(rotation)*0,
    targetY+2.2,
    zoom
  );

  camera.lookAt(0,targetY,0);

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
});
</script>
</body>
</html>
