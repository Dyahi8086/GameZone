<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameZone - Cyberpunk Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background ko Dark Studio Grey kar diya hai */
        body {
            background-color: #1a1a1a; /* Professional Dark Grey */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh; 
            overflow: hidden;
            /* Ek subtle gradient taaki car ke peeche depth aaye */
            background: radial-gradient(circle at center, #2a2a2a 0%, #0a0a0a 100%);
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        /* Text ka glow thoda aur sharp kiya hai taaki grey bg par pop kare */
        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 1), 0 0 20px rgba(0, 255, 255, 0.8);
        }

        .header p {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cccccc;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hint {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6); /* Dark hint box */
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.5);
        }

        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 20;
            text-align: center;
            max-width: 90%;
        }

        #loading {
            background: rgba(10, 10, 10, 0.9);
            color: #00ffff;
            border: 1px solid #00ffff;
        }

        #error {
            background: #2a0000;
            color: #ff5555;
            border: 2px solid #ff0000;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
                <p>Cyberpunk Experience</p>
            </div>
            <div class="hint">
                Drag to rotate · Pinch to zoom
            </div>
        </div>

        <div id="loading">Car Loading...</div>
        <div id="error"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        // Scene ka background transparent (null) rakha hai taaki CSS ka gradient dikhe
        scene.background = null; 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha: true zaroori hai
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5; 
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- LIGHTS (Black Car ko chamkane ke liye) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5); // Overall brightness
        scene.add(ambientLight);

        // Front Light (Car ke bonnet par shine)
        const keyLight = new THREE.DirectionalLight(0xffffff, 4.0);
        keyLight.position.set(5, 10, 7);
        scene.add(keyLight);

        // Top Light (Roof aur window par shine)
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 15, 0);
        scene.add(topLight);

        // Left Cyan Neon (Side profile highlight)
        const cyanLight = new THREE.PointLight(0x00ffff, 150, 30);
        cyanLight.position.set(-8, 4, 5);
        scene.add(cyanLight);

        // Right Magenta Neon (Side profile highlight)
        const magentaLight = new THREE.PointLight(0xff00ff, 150, 30);
        magentaLight.position.set(8, 4, -5);
        scene.add(magentaLight);


        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });


        // --- LOAD MODEL ---
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const modelPath = './cyberpunk_car.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            // Agar car ka material bahut zyada dark hai, toh environment reflection ke liye
                            child.material.envMapIntensity = 1.5;
                        }
                    }
                });

                scene.add(model);

                // Auto Center
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                cameraZ *= 1.5; // Padding
                camera.position.set(0, maxDim * 0.3, cameraZ); 
                camera.lookAt(0, 0, 0);

                controls.target.set(0, 0, 0);
                controls.update();
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.textContent = `Loading Car... ${percent}%`;
                }
            },
            (error) => {
                console.error('Error:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.innerHTML = `⚠️ <b>Model Load Failed!</b><br>File ka naam check karo.`;
            }
        );

        // --- ANIMATION ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
