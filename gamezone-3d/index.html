<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e6e7eb">

  <title>GAMEZONE | Cyberpunk Experience</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #e6e7eb;
      color: #050505;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      z-index: 2;
      width: 100%;
      padding: 38px 12px 0;
      text-align: center;
      pointer-events: none;
    }

    .logo {
      margin: 0;
      font-size: clamp(30px, 7vw, 54px);
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 10px #00eaff70;
    }

    .subtitle {
      margin-top: 9px;
      font-size: 11px;
      letter-spacing: 4px;
      color: #333;
    }

    #car-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: pan-y;
    }

    #car-view canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
      outline: none;
    }

    .bottom {
      position: absolute;
      z-index: 3;
      bottom: max(25px, env(safe-area-inset-bottom));
      left: 0;
      width: 100%;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: none;
    }

    .hint {
      padding: 10px 20px;
      background: #ffffffd9;
      border: 1px solid #222;
      border-radius: 30px;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }

    .enter {
      pointer-events: auto;
      display: block;
      width: min(100%, 360px);
      padding: 16px 12px;
      background: transparent;
      color: #050505;
      border: 2px solid #111;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 3px;
      font-size: 15px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .enter:active {
      background: #111;
      color: white;
    }

    #status {
      position: absolute;
      z-index: 4;
      top: 48%;
      left: 0;
      width: 100%;
      padding: 12px;
      text-align: center;
      font-size: 13px;
      color: #444;
      pointer-events: none;
    }

    #status.error {
      color: #a00000;
    }

    @media (min-width: 700px) {
      header {
        padding-top: 28px;
      }

      .bottom {
        bottom: 24px;
      }

      .enter {
        width: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <h1 class="logo">GAMEZONE</h1>
      <div class="subtitle">CYBERPUNK EXPERIENCE</div>
    </header>

    <div id="car-view" aria-label="Interactive 3D car"></div>

    <div id="status">Loading 3D model...</div>

    <div class="bottom">
      <div class="hint">Drag to rotate · Pinch to zoom</div>
      <a class="enter" href="games.html">ENTER GAMEZONE</a>
    </div>

  </main>

  <script type="module">
    const view = document.getElementById("car-view");
    const status = document.getElementById("status");

    async function startGameZone() {
      try {
        // Load 3D engine only when needed.
        const THREE = await import(
          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        );

        const { GLTFLoader } = await import(
          "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
        );

        const { OrbitControls } = await import(
          "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
        );

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe6e7eb);

        const camera = new THREE.PerspectiveCamera(
          40,
          view.clientWidth / view.clientHeight,
          0.01,
          2000
        );

        const renderer = new THREE.WebGLRenderer({
          antialias: false,
          alpha: false,
          powerPreference: "low-power"
        });

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio || 1, 1.5)
        );

        renderer.setSize(view.clientWidth, view.clientHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        view.appendChild(renderer.domElement);

        // Simple lighting for fast rendering.
        scene.add(new THREE.HemisphereLight(0xffffff, 0x777783, 2));

        const light = new THREE.DirectionalLight(0xffffff, 2.2);
        light.position.set(5, 10, 8);
        scene.add(light);

        const controls = new OrbitControls(camera, renderer.domElement);

        controls.enableDamping = true;
        controls.dampingFactor = 0.06;

        controls.enableZoom = true;
        controls.enablePan = false;
        controls.zoomSpeed = 0.65;

        // Prevent the camera from moving below the car.
        controls.minPolarAngle = 0.15;
        controls.maxPolarAngle = Math.PI * 0.49;

        // Set after measuring the actual model.
        controls.minDistance = 2;
        controls.maxDistance = 10;

        // Load your model from the same folder as index.html.
        const loader = new GLTFLoader();

        loader.load(
          "./character_fight.glb",

          (gltf) => {
            const car = gltf.scene;

            // Measure model and center it around the origin.
            const box = new THREE.Box3().setFromObject(car);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            car.position.sub(center);
            scene.add(car);

            // Recalculate the centered model bounds.
            const centeredBox = new THREE.Box3().setFromObject(car);
            const centeredSize = centeredBox.getSize(
              new THREE.Vector3()
            );

            const maxDimension = Math.max(
              centeredSize.x,
              centeredSize.y,
              centeredSize.z,
              0.1
            );

            // Fit model to the viewport.
            const halfFov = THREE.MathUtils.degToRad(
              camera.fov / 2
            );

            const fitDistance =
              (maxDimension / 2) / Math.tan(halfFov);

            const distance = fitDistance * 1.8;

            camera.position.set(
              distance * 0.75,
              distance * 0.35,
              distance * 1.5
            );

            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);

            // Zoom limits scale with the real model size.
            controls.minDistance = Math.max(
              maxDimension * 0.8,
              0.1
            );

            controls.maxDistance = Math.max(
              maxDimension * 5,
              distance * 2
            );

            // Keep camera clipping range suitable for the model.
            camera.near = Math.max(
              maxDimension / 1000,
              0.01
            );

            camera.far = Math.max(
              maxDimension * 100,
              100
            );

            camera.updateProjectionMatrix();

            // Start at a safe viewing distance.
            controls.minDistance = Math.min(
              controls.minDistance,
              distance * 0.8
            );

            controls.maxDistance = Math.max(
              controls.maxDistance,
              distance * 2
            );

            controls.update();

            status.style.display = "none";
          },

          undefined,

          (error) => {
            console.error("3D model loading failed:", error);
            status.classList.add("error");
            status.textContent =
              "Model load nahi hua. File name aur path check karo.";
          }
        );

        // Keep the page responsive on mobile and desktop.
        function resize() {
          const width = view.clientWidth;
          const height = view.clientHeight;

          if (!width || !height) return;

          camera.aspect = width / height;
          camera.updateProjectionMatrix();

          renderer.setSize(width, height);

          renderer.setPixelRatio(
            Math.min(window.devicePixelRatio || 1, 1.5)
          );
        }

        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", resize);

        // Render only when the browser can display the page.
        renderer.setAnimationLoop(() => {
          controls.update();
          renderer.render(scene, camera);
        });

      } catch (error) {
        console.error("GameZone startup error:", error);
        status.classList.add("error");
        status.textContent =
          "3D engine load nahi hua. Internet connection check karo.";
      }
    }

    startGameZone();
  </script>
</body>
</html>
