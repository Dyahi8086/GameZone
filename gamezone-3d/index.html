<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Website - 3D Model</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a0a; /* Dark background for gaming vibe */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 3D Model yahan render hoga -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a); // Dark background

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4); // Model ke saamne position

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // Shadows enable
        document.body.appendChild(renderer.domElement);

        // 4. Lighting (Model ko roshni dikhane ke liye)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Base light
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Thoda neon/gaming effect ke liye blue light
        const pointLight = new THREE.PointLight(0x00ffff, 5, 10);
        pointLight.position.set(-3, 2, 3);
        scene.add(pointLight);

        // 5. Controls (User mouse se ghumaa sake)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; // Model khud ghumega
        controls.autoRotateSpeed = 1.0;
        controls.enableZoom = false; // Zoom band (optional)

        // 6. Model Loading
        const loader = new GLTFLoader();
        
        // Yahan tumhari file ka naam hai, agar folder mein hai to path likho
        loader.load(
            'character_jepll.glb', 
            (gltf) => {
                const model = gltf.scene;
                
                // Model ka size adjust karna (agar bahut bada/chhota ho)
                model.scale.set(1, 1, 1); 
                
                // Model ki position adjust karna (ground pe laane ke liye)
                model.position.y = 0;

                // Agar model ke andar animation hai to play karo
                if (gltf.animations && gltf.animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                    
                    // Animation update loop
                    const clock = new THREE.Clock();
                    function animateAnimation() {
                        requestAnimationFrame(animateAnimation);
                        const delta = clock.getDelta();
                        mixer.update(delta);
                    }
                    animateAnimation();
                }

                scene.add(model);
            },
            (xhr) => {
                // Loading progress (console mein dikhega)
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('Model load karne mein error aaya:', error);
            }
        );

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. Resize Handling (Window size change pe adjust)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
