<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Play & Explore</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f3f4f6;
            font-family: 'Orbitron', sans-serif;
            color: #000000;
            overflow: hidden;
        }

        /* --- 3D HOME SCREEN --- */
        #home-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 10;
        }

        #home-screen.hidden {
            opacity: 0;
            transform: scale(1.05); 
            pointer-events: none;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #000;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .enter-btn:hover, .enter-btn:active { 
            background: #000; 
            color: #ff69b4; 
            box-shadow: 0 0 30px #ff69b4; 
            transform: scale(1.05);
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 100;
            color: #000;
        }

        /* --- GAMES DASHBOARD SCREEN --- */
        #dashboard-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 5;
            overflow-y: auto;
        }

        #dashboard-screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        /* 🔥 FIX: Header ko thoda padding diya aur responsive kiya */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px; /* Side se padding kam ki taaki jagah bache */
            background: rgba(10, 10, 10, 0.95); /* Thoda solid background */
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 2px solid rgba(255,105,180,0.4);
            flex-wrap: wrap; /* Agar jagah kam ho toh niche aa jaye */
            gap: 10px;
        }

        .dash-header h2 {
            font-size: clamp(1.2rem, 5vw, 1.8rem); /* Text auto adjust */
            color: #ff69b4;
            text-shadow: 0 0 15px rgba(255,105,180,0.6);
            letter-spacing: 2px;
            line-height: 1.2;
            max-width: 65%; /* Taaki button ke saath fit ho */
        }

        .back-btn {
            background: transparent;
            color: #ff69b4;
            border: 1px solid #ff69b4;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: 0.3s;
            white-space: nowrap; /* Text ek line mein rahe */
        }

        .back-btn:hover, .back-btn:active {
            background: #ff69b4;
            color: #000;
            box-shadow: 0 0 15px #ff69b4;
        }

        /* 🔥 FIX: Grid Layout */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); /* Mobile pe 2 columns */
            gap: 15px;
            padding: 20px 15px;
        }

        /* Desktop ke liye grid adjust */
        @media (min-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                padding: 40px 30px;
                gap: 25px;
            }
            .dash-header { padding: 20px 40px; }
            .dash-header h2 { max-width: 100%; }
        }

        .game-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #333;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,105,180,0.3);
            border-color: #ff69b4;
        }

        .game-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #222, #444);
            z-index: 1;
            transition: 0.3s;
        }
        
        .game-card:hover .game-bg {
            transform: scale(1.1); /* Zoom effect on hover */
        }

        .game-bg.c1 { background: linear-gradient(45deg, #3a1c71, #d76d77, #ffaf7b); }
        .game-bg.c2 { background: linear-gradient(45deg, #0f2027, #203a43, #2c5364); }
        .game-bg.c3 { background: linear-gradient(45deg, #4b134f, #c94b4b); }
        .game-bg.c4 { background: linear-gradient(45deg, #000428, #004e92); }

        .game-info {
            position: relative;
            z-index: 2;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .game-info h3 {
            font-size: 1rem;
            margin-bottom: 3px;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        .game-info p {
            font-size: 0.7rem;
            color: #ff69b4;
            font-family: sans-serif;
            font-weight: bold;
        }

        .play-tag {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff69b4;
            color: #000;
            padding: 4px 8px;
            font-size: 0.6rem;
            font-weight: bold;
            border-radius: 3px;
            z-index: 2;
            opacity: 0;
            transform: scale(0.8);
            transition: 0.3s;
        }

        .game-card:hover .play-tag {
            opacity: 1;
            transform: scale(1);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #ff69b4; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN (3D Model) -->
    <div id="home-screen">
        <div id="loading">Loading Experience...</div>
        
        <div id="canvas-container"></div>

        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
            </div>
            <div class="bottom-section">
                <button class="enter-btn" id="enterBtn">Enter GameZone</button>
            </div>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN (Games Grid) -->
    <div id="dashboard-screen">
        <div class="dash-header">
            <h2>SELECT YOUR GAME</h2>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>

        <div class="games-grid">
            <!-- Game Card 1 -->
            <div class="game-card">
                <div class="game-bg c1"></div>
                <div class="play-tag">PLAY</div>
                <div class="game-info">
                    <h3>Cyber Racer</h3>
                    <p>Racing · 3D</p>
                </div>
            </div>

            <!-- Game Card 2 -->
            <div class="game-card">
                <div class="game-bg c2"></div>
                <div class="play-tag">PLAY</div>
                <div class="game-info">
                    <h3>Neon Shooter</h3>
                    <p>Action · FPS</p>
                </div>
            </div>

            <!-- Game Card 3 -->
            <div class="game-card">
                <div class="game-bg c3"></div>
                <div class="play-tag">PLAY</div>
                <div class="game-info">
                    <h3>Puzzle Matrix</h3>
                    <p>Brain · Logic</p>
                </div>
            </div>

            <!-- Game Card 4 -->
            <div class="game-card">
                <div class="game-bg c4"></div>
                <div class="play-tag">PLAY</div>
                <div class="game-info">
                    <h3>Space Explorer</h3>
                    <p>Adventure · 3D</p>
                </div>
            </div>
            
            <!-- Game Card 5 -->
            <div class="game-card">
                <div class="game-bg c1"></div>
                <div class="play-tag">PLAY</div>
                <div class="game-info">
                    <h3>Ludo King</h3>
                    <p>Board · Classic</p>
                </div>
            </div>
            
            <!-- Game Card 6 -->
            <div class="game-card">
                <div class="game-bg c2"></div>
                <div class="play-tag">PLAY</div>
                <div class="game-info">
                    <h3>Subway Surf</h3>
                    <p>Runner · 3D</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

        // --- UI LOGIC ---
        const enterBtn = document.getElementById('enterBtn');
        const backBtn = document.getElementById('backBtn');
        const homeScreen = document.getElementById('home-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');

        enterBtn.addEventListener('click', () => {
            homeScreen.classList.add('hidden');
            setTimeout(() => {
                dashboardScreen.classList.add('active');
            }, 300);
        });

        backBtn.addEventListener('click', () => {
            dashboardScreen.classList.remove('active');
            setTimeout(() => {
                homeScreen.classList.remove('hidden');
            }, 300);
        });


        // --- 3D SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf3f4f6); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; 
        renderer.shadowMap.enabled = true; 
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 20, 10);
        topLight.castShadow = true;
        scene.add(topLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const modelPath = './smol_ame_in_an_upcycled_terrarium_hololiveen.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 1.5; 
                        }
                    }
                });

                scene.add(model);

                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                const fixedDistance = maxDim * 2.0; 

                camera.position.set(fixedDistance * 0.4, fixedDistance * 0.3, fixedDistance * 0.9); 
                camera.lookAt(0, 0, 0);
                
                controls.target.set(0, 0, 0);
                controls.minDistance = fixedDistance * 1.0; 
                controls.maxDistance = fixedDistance * 1.8;
                controls.update();

                const planeGeometry = new THREE.PlaneGeometry(100, 100);
                const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.15 }); 
                const shadowPlane = new THREE.Mesh(planeGeometry, planeMaterial);
                shadowPlane.rotation.x = -Math.PI / 2;
                shadowPlane.position.y = -size.y / 2 - 0.05; 
                shadowPlane.receiveShadow = true;
                scene.add(shadowPlane);
            },
            undefined,
            (error) => {
                loadingEl.style.display = 'none';
                alert("Model Load Failed! Check File Name in GitHub.");
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
