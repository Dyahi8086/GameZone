<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GameZone | Blue Machine</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

#stage {
  position: fixed;
  inset: 0;
  z-index: 0;
}

header {
  position: absolute;
  z-index: 2;
  top: 18px;
  left: 5%;
  pointer-events: none;
}

h1 {
  margin: 0;
  font-size: clamp(25px, 6vw, 42px);
  letter-spacing: 4px;
}

header p {
  color: #aebed8;
  font-size: 13px;
}

#panel {
  position: absolute;
  z-index: 3;
  bottom: 18px;
  left: 4%;
  width: 92%;
  padding: 12px;
  border: 1px solid #314563;
  border-radius: 16px;
  background: rgba(9, 16, 29, .92);
}

#status {
  color: #9bcaff;
  font-size: 12px;
  margin-bottom: 10px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

button {
  padding: 12px 4px;
  border: 1px solid #35527c;
  border-radius: 10px;
  background: #17243a;
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  background: #176bd5;
}

button.active {
  background: #0758c8;
  border-color: #7abaff;
}

#hint {
  margin-top: 9px;
  color: #9da9bd;
  font-size: 11px;
  text-align: center;
}

canvas {
  display: block;
  touch-action: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="stage"></div>

<header>
  <h1>GAMEZONE</h1>
  <p>BLUE MACHINE · 3D CAR EXPERIENCE</p>
</header>

<div id="panel">
  <div id="status">Loading 3D car...</div>

  <div class="buttons">
    <button id="blue">🔵 BLUE CAR</button>
    <button id="light" class="active">💡 LIGHTING ON</button>
    <button id="auto">🔄 AUTO ROTATE: ON</button>
    <button id="reset">🎯 RESET VIEW</button>
    <button id="zoomIn">＋ ZOOM IN</button>
    <button id="zoomOut">－ ZOOM OUT</button>
  </div>

  <div id="hint">
    DRAG TO ROTATE · PINCH TO ZOOM · EXPLORE YOUR CAR
  </div>
</div>

<script type="module">
const status = document.getElementById("status");

try {
  const THREE = await import("three");

  const { GLTFLoader } = await import(
    "three/addons/loaders/GLTFLoader.js"
  );

  const { OrbitControls } = await import(
    "three/addons/controls/OrbitControls.js"
  );

  const stage = document.getElementById("stage");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080b12);

  const camera = new THREE.PerspectiveCamera(
    42,
    innerWidth / innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  stage.appendChild(renderer.domElement);

  // Premium lighting
  const ambient = new THREE.HemisphereLight(
    0xffffff, 0x273956, 2.0
  );
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xffffff, 3);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);

  const blueLight = new THREE.PointLight(0x1684ff, 35, 18);
  blueLight.position.set(-4, 3, -3);
  scene.add(blueLight);

  const rimLight = new THREE.DirectionalLight(0x287dff, 2.5);
  rimLight.position.set(-5, 4, -6);
  scene.add(rimLight);

  // Display floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(5, 96),
    new THREE.MeshStandardMaterial({
      color: 0x202b3c,
      roughness: 0.35,
      metalness: 0.25
    })
  );

  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.03;
  scene.add(floor);

  // Camera controls
  const controls = new OrbitControls(
    camera, renderer.domElement
  );

  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  controls.minDistance = 2;
  controls.maxDistance = 14;
  controls.minPolarAngle = 0.25;
  controls.maxPolarAngle = Math.PI / 2.05;

  let car = null;
  let originalMaterials = [];
  let blueMode = false;
  let lightingOn = true;
  let autoOn = true;

  // Load existing car model
  const loader = new GLTFLoader();

  loader.load(
    "./cartoon_sports_car.glb",

    (gltf) => {
      car = gltf.scene;

      const box = new THREE.Box3().setFromObject(car);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const largest = Math.max(size.x, size.y, size.z);

      if (!largest || !Number.isFinite(largest)) {
        status.textContent = "Could not determine car size.";
        return;
      }

      const scale = 3.5 / largest;
      car.scale.setScalar(scale);

      car.position.set(
        -center.x * scale,
        -box.min.y * scale,
        -center.z * scale
      );

      scene.add(car);

      // Save original material colors for restoring
      car.traverse((obj) => {
        if (!obj.isMesh) return;

        const materials = Array.isArray(obj.material)
          ? obj.material
          : [obj.material];

        materials.forEach((mat) => {
          if (!mat || !mat.color) return;

          originalMaterials.push({
            material: mat,
            color: mat.color.clone()
          });
        });
      });

      const finalBox = new THREE.Box3().setFromObject(car);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const finalCenter = finalBox.getCenter(new THREE.Vector3());

      controls.target.set(
        finalCenter.x,
        finalBox.min.y + finalSize.y * 0.4,
        finalCenter.z
      );

      camera.position.set(
        finalCenter.x + 5,
        finalCenter.y + 2.5,
        finalCenter.z + 6
      );

      controls.update();
      controls.saveState();

      status.textContent =
        "3D car loaded! Blue paint and controls ready.";

      // Start with blue tint
      setBlue(true);
    },

    (event) => {
      if (event.total > 0) {
        const percent = Math.round(
          event.loaded / event.total * 100
        );
        status.textContent = "Loading car... " + percent + "%";
      }
    },

    (error) => {
      console.error(error);
      status.textContent =
        "Car loading failed. Check the GLB filename.";
    }
  );

  // Blue color effect
  function setBlue(enabled) {
    if (!car) {
      status.textContent = "Wait for the car to load.";
      return;
    }

    blueMode = enabled;

    originalMaterials.forEach((entry) => {
      if (enabled) {
        entry.material.color.set(0x1685ff);
      } else {
        entry.material.color.copy(entry.color);
      }
    });

    document.getElementById("blue").classList.toggle(
      "active", enabled
    );

    status.textContent = enabled
      ? "Blue color enabled!"
      : "Original model colors restored.";
  }

  document.getElementById("blue").onclick = () => {
    setBlue(!blueMode);
  };

  // Lighting toggle
  document.getElementById("light").onclick = () => {
    lightingOn = !lightingOn;

    ambient.intensity = lightingOn ? 2.0 : 0.45;
    keyLight.intensity = lightingOn ? 3 : 0.6;
    blueLight.intensity = lightingOn ? 35 : 0;
    rimLight.intensity = lightingOn ? 2.5 : 0;

    const btn = document.getElementById("light");
    btn.textContent = lightingOn
      ? "💡 LIGHTING ON"
      : "💡 LIGHTING OFF";

    btn.classList.toggle("active", lightingOn);

    status.textContent = lightingOn
      ? "Premium lighting enabled!"
      : "Lighting reduced.";
  };

  // Auto rotation toggle
  document.getElementById("auto").onclick = () => {
    autoOn = !autoOn;
    controls.autoRotate = autoOn;

    const btn = document.getElementById("auto");
    btn.textContent = autoOn
      ? "🔄 AUTO ROTATE: ON"
      : "🔄 AUTO ROTATE: OFF";

    btn.classList.toggle("active", autoOn);
    status.textContent = autoOn
      ? "Auto rotation enabled!"
      : "Auto rotation paused.";
  };

  // Reset camera
  document.getElementById("reset").onclick = () => {
    controls.reset();
    status.textContent = "Camera view reset!";
  };

  // Zoom controls
  document.getElementById("zoomIn").onclick = () => {
    controls.dollyIn(1.25);
    controls.update();
  };

  document.getElementById("zoomOut").onclick = () => {
    controls.dollyOut(1.25);
    controls.update();
  };

  // Responsive layout
  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

} catch (error) {
  console.error(error);
  status.textContent =
    "Error: " + (error.message || "Could not start 3D scene.");
}
</script>
</body>
</html>
