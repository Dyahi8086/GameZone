<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Premium Experience</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #61c0d1; /* Sketchfab wala Light Teal Background */
            font-family: 'Orbitron', sans-serif;
            color: #000000;
            overflow: hidden;
        }

        /* --- HOME SCREEN (3D MODEL) --- */
        #home-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 10;
        }

        #home-screen.hidden {
            opacity: 0;
            transform: scale(1.05); 
            pointer-events: none;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff; /* White text for teal background */
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .enter-btn:hover, .enter-btn:active { 
            background: #fff; 
            color: #61c0d1; 
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5); 
            transform: scale(1.05);
        }

        /* Simple Loading Text */
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            z-index: 100;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* ========================================= */
        /* --- DASHBOARD SCREEN --- */
        /* ========================================= */
        #dashboard-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #0b0c10; 
            background-image: radial-gradient(circle at 50% 0%, #1f2330 0%, #050505 80%);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
            overflow-y: auto;
        }

        #dashboard-screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(11, 12, 16, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }
        
        .back-btn {
            background: transparent; color: #00ffff; border: 1px solid #00ffff;
            padding: 8px 20px; border-radius: 4px; font-family: 'Orbitron', sans-serif;
            cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .back-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }

        .hero-banner {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 250px;
            margin: 30px auto;
            background: linear-gradient(135deg, #e2e8f0 0%, #ffffff 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .hero-banner h1 {
            font-size: 4rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px #3b82f6;
            opacity: 0.2;
            position: absolute;
            letter-spacing: 10px;
            white-space: nowrap;
        }
        .hero-character {
            position: absolute;
            bottom: 0;
            right: 10%;
            height: 110%;
            background-size: contain;
            background-position: bottom;
            background-repeat: no-repeat;
            filter: drop-shadow(-10px 0 20px rgba(0,0,0,0.3));
        }

        .section-title {
            text-align: center;
            margin: 40px 0 20px;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            padding: 20px 40px 80px;
            max-width: 1100px;
            margin: 0 auto;
            perspective: 1200px;
        }

        .game-card {
            position: relative;
            height: 320px;
            border-radius: 15px;
            background: #15171e;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            transform-style: preserve-3d;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .game-card:hover {
            transform: translateY(-10px) rotateX(8deg) rotateY(-8deg) scale(1.05);
            box-shadow: -15px 20px 50px rgba(255, 0, 85, 0.4);
            border-color: #ff0055;
        }

        .card-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
            opacity: 0.8;
        }
        .game-card:hover .card-img {
            transform: scale(1.1);
            opacity: 1;
        }

        .card-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 70%;
            background: linear-gradient(to top, #0b0c10 10%, rgba(11,12,16,0.8) 50%, transparent);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 5px;
            color: #fff;
            text-transform: uppercase;
            transform: translateZ(30px);
        }
        .game-category {
            font-family: sans-serif;
            font-size: 1rem;
            color: #00ffff;
            font-weight: 700;
            letter-spacing: 1px;
            transform: translateZ(20px);
        }

        .play-action {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ff0055;
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: 0.3s;
            z-index: 10;
            box-shadow: 0 0 20px #ff0055;
        }
        .game-card:hover .play-action {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 768px) {
            .hero-banner { height: 180px; }
            .hero-banner h1 { font-size: 2.5rem; }
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 10px 15px 50px; }
            .game-card { height: 220px; border-radius: 10px; }
            .game-title { font-size: 1rem; }
            .game-category { font-size: 0.8rem; }
            .card-overlay { padding: 10px; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0c10; }
        ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN (3D Model) -->
    <div id="home-screen">
        <div id="loading">Loading...</div>
        <div id="canvas-container"></div>
        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
            </div>
            <div class="bottom-section">
                <button type="button" class="enter-btn" id="enterBtn">Enter GameZone</button>
            </div>
        </div>
    </div>

    <!-- 2. DASHBOARD SCREEN -->
    <div id="dashboard-screen">
        <div class="top-nav">
            <div class="nav-logo">GAMEZONE</div>
            <button type="button" class="back-btn" id="backBtn">← RETURN TO 3D</button>
        </div>

        <div class="hero-banner">
            <h1>JACK UI</h1>
            <div class="hero-character" style="background-image: url('https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=600&auto=format&fit=crop'); width: 40%; right: 5%;"></div>
        </div>

        <h2 class="section-title">SELECT YOUR GAME</h2>

        <div class="games-grid">
            <div class="game-card" style="border-color: rgba(0, 255, 255, 0.3);">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action" style="background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff;">PLAY</div>
                <div class="card-overlay">
                    <div class="game-title">Neon Strike</div>
                    <div class="game-category" style="color: #00ffff;">FPS · ACTION</div>
                </div>
            </div>

            <div class="game-card" style="border-color: rgba(255, 0, 85, 0.3);">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action" style="background: #ff0055; box-shadow: 0 0 20px #ff0055;">PLAY</div>
                <div class="card-overlay">
                    <div class="game-title">Cyber Racer</div>
                    <div class="game-category" style="color: #ff0055;">RACING · 3D</div>
                </div>
            </div>

            <div class="game-card" style="border-color: rgba(255, 165, 0, 0.3);">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action" style="background: orange; color: #000; box-shadow: 0 0 20px orange;">PLAY</div>
                <div class="card-overlay">
                    <div class="game-title">Space Ace</div>
                    <div class="game-category" style="color: orange;">ADVENTURE</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

        const enterBtn = document.getElementById('enterBtn');
        const backBtn = document.getElementById('backBtn');
        const homeScreen = document.getElementById('home-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loadingEl = document.getElementById('loading');

        // --- 3D SETUP ---
        const scene = new THREE.Scene();
        // 3D Scene background ko bhi same color kar diya
        scene.background = new THREE.Color(0x61c0d1); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // Soft Lighting for the cute model
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 2.5);
        topLight.position.set(0, 20, 10);
        topLight.castShadow = true;
        scene.add(topLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        const loader = new GLTFLoader();
        const modelPath = './smol_ame_in_an_upcycled_terrarium_hololiveen.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none'; // Loading text hide
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 1.5; 
                        }
                    }
                });

                scene.add(model);

                // --- PERFECT CENTER & ZOOM LOCK ---
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                const fixedDistance = maxDim * 2.0; 

                camera.position.set(fixedDistance * 0.4, fixedDistance * 0.3, fixedDistance * 0.9); 
                camera.lookAt(0, 0, 0);
                
                controls.target.set(0, 0, 0);
                controls.minDistance = fixedDistance * 1.0; 
                controls.maxDistance = fixedDistance * 1.8;
                controls.update();
            },
            undefined,
            (error) => {
                loadingEl.style.display = 'none';
                alert("Model Load Failed! Check File Name.");
            }
        );

        // --- UI LOGIC ---
        enterBtn.addEventListener('click', (e) => {
            e.preventDefault();
            homeScreen.classList.add('hidden');
            setTimeout(() => { dashboardScreen.classList.add('active'); }, 300);
        });

        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            dashboardScreen.classList.remove('active');
            setTimeout(() => { homeScreen.classList.remove('hidden'); }, 300);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
