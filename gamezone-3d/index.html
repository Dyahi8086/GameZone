<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Hololive Experience</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #f3f4f6; /* Soft Pastel Grey Background */
            font-family: 'Orbitron', sans-serif;
            color: #000000;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header { text-align: center; margin-top: 20px; }
        
        /* Text Color Pink/Cyan anime vibe ke liye */
        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #000;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8); /* Pink Glow */
        }

        .header p {
            font-size: clamp(0.7rem, 3vw, 1rem);
            font-weight: 700;
            color: #555;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #000;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .enter-btn:hover, .enter-btn:active { 
            background: #000; 
            color: #ff69b4; /* Pink hover */
            box-shadow: 0 0 20px #ff69b4; 
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 100;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="loading">Loading Experience...</div>

    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p>Hololive Experience</p>
        </div>
        <div class="bottom-section">
            <div class="hint">Drag to rotate · Pinch to zoom</div>
            <button class="enter-btn" id="enterBtn">Enter GameZone</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        // Background color exactly body se match kiya hai
        scene.background = new THREE.Color(0xf3f4f6); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; // Thoda bright taaki colors pop karein
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // LIGHTS (Soft Studio Lighting for cute character)
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 20, 10);
        topLight.castShadow = true;
        scene.add(topLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 2.0);
        fillLight.position.set(10, 10, 10);
        scene.add(fillLight);

        // CONTROLS
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // LOAD MODEL (NAYA MODEL)
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        // File ka naam exactly yahan hai
        const modelPath = './smol_ame_in_an_upcycled_terrarium_hololiveen.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                // Original Colors preserve karne ke liye
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 1.5; 
                        }
                    }
                });

                scene.add(model);

                // --- 100% FIXED CENTER & ZOOM ---
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                // Model ko exact center mein shift karo
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                // Character ke liye perfect camera distance
                const maxDim = Math.max(size.x, size.y, size.z);
                const fixedDistance = maxDim * 2.0; // Character ke liye 2.0 best hai

                camera.position.set(fixedDistance * 0.4, fixedDistance * 0.3, fixedDistance * 0.9); 
                camera.lookAt(0, 0, 0);
                
                // Target hamesha center
                controls.target.set(0, 0, 0);
                
                // Zoom limits (Character kabhi hide nahi hoga)
                controls.minDistance = fixedDistance * 1.0; 
                controls.maxDistance = fixedDistance * 1.8;
                
                controls.update();

                // Floor Shadow
                const planeGeometry = new THREE.PlaneGeometry(100, 100);
                const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.15 }); // Light shadow
                const shadowPlane = new THREE.Mesh(planeGeometry, planeMaterial);
                shadowPlane.rotation.x = -Math.PI / 2;
                shadowPlane.position.y = -size.y / 2 - 0.05; 
                shadowPlane.receiveShadow = true;
                scene.add(shadowPlane);
            },
            undefined,
            (error) => {
                loadingEl.style.display = 'none';
                alert("Model Load Failed! Check File Name in GitHub.");
                console.error(error);
            }
        );

        document.getElementById('enterBtn').addEventListener('click', () => {
            alert("Welcome to GameZone!");
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
