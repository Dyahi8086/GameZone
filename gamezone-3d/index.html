<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameZone - 3D Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Ekdum Black Background */
        body {
            overflow: hidden;
            background-color: #000000; /* Pitch Black */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            touch-action: none;
        }

        /* UI Overlay */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        /* Text white kar diya black bg ke liye */
        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #ffffff; /* White */
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2); /* Thoda glow */
        }

        .header p {
            font-size: 1rem;
            font-weight: 500;
            color: #9ca3af; /* Light grey subtitle */
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hint {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d1d5db;
            background: rgba(30, 30, 30, 0.8); /* Dark hint box */
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Loading & Error Messages */
        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 20;
            text-align: center;
            max-width: 90%;
        }

        #loading {
            background: rgba(20, 20, 20, 0.9);
            color: #ffffff;
            border: 1px solid #333;
        }

        #error {
            background: rgba(50, 10, 10, 0.9);
            color: #f87171;
            border: 1px solid #b91c1c;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- UI Elements -->
    <div class="ui-container">
        <div class="header">
            <h1>GameZone</h1>
            <p>3D Experience</p>
        </div>
        <div class="hint">
            Drag to rotate · Pinch to zoom
        </div>
    </div>

    <!-- Status Messages -->
    <div id="loading">Loading...</div>
    <div id="error"></div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        // Scene background bhi ekdum black kar diya
        scene.background = new THREE.Color(0x000000); 

        // --- 2. Camera Setup ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1, 5);

        // --- 3. Renderer Setup ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false,
            powerPreference: "high-performance" 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        document.body.appendChild(renderer.domElement);

        // --- 4. Lighting (Black bg par model chamkane ke liye bright lights) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        // Main light
        const keyLight = new THREE.DirectionalLight(0xffffff, 3);
        keyLight.position.set(5, 10, 7);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);

        // Fill light (side se)
        const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Peeche se ek light taaki edges clear dikhein
        const backLight = new THREE.DirectionalLight(0xffffff, 1);
        backLight.position.set(0, 5, -10);
        scene.add(backLight);

        // --- 5. Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.enablePan = false; 
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        
        controls.addEventListener('start', () => {
            controls.autoRotate = false;
        });

        // --- 6. Model Loading ---
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');

        const modelPath = './character_fight.glb';

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // Materials untouched - Original look preserved
                    }
                });

                scene.add(model);

                // --- 7. Auto-Center and Frame ---
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - center.y);
                model.position.z += (model.position.z - center.z);

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                cameraZ *= 1.3; 

                camera.position.set(0, 0, cameraZ);
                camera.lookAt(0, 0, 0);

                controls.target.set(0, 0, 0);
                controls.update();

                // Animations
                if (gltf.animations && gltf.animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();

                    const clock = new THREE.Clock();
                    function animateMixer() {
                        requestAnimationFrame(animateMixer);
                        mixer.update(clock.getDelta());
                    }
                    animateMixer();
                }
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.textContent = `Loading... ${percent}%`;
                }
            },
            (error) => {
                console.error('Error loading GLB model:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = `Failed to load model.\n\nPlease check if "${modelPath}" exists.`;
            }
        );

        // --- 8. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // --- 9. Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
