<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE MACHINE | GameZone</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b10;color:white;
  font-family:Arial,sans-serif;overflow:hidden
}
header{position:absolute;top:20px;left:6%;z-index:2}
h1{font-size:clamp(25px,5vw,48px);letter-spacing:5px;margin:0}
p{color:#aaa}
#stage{width:100vw;height:100vh}
#status{
  position:absolute;bottom:25px;left:6%;
  color:#ddd;background:#151820;padding:12px 16px;
  border-radius:8px;max-width:88%;font-size:14px
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>
<header>
  <h1>THE MACHINE</h1>
  <p>One car. Dark studio. Pure detail.</p>
</header>

<div id="stage"></div>
<div id="status">Loading 3D car...</div>

<script type="module">
const status = document.getElementById("status");

try {
  const THREE = await import("three");
  const { GLTFLoader } = await import(
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
  );

  const stage = document.getElementById("stage");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090b10);

  const camera = new THREE.PerspectiveCamera(
    45, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(5, 3, 7);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2));

  const light = new THREE.DirectionalLight(0xffffff, 3);
  light.position.set(5, 8, 6);
  scene.add(light);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
      color: 0x151820,
      roughness: 0.75
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.02;
  scene.add(floor);

  const loader = new GLTFLoader();

  loader.load(
    "./cartoon_sports_car.glb",

    (gltf) => {
      const car = gltf.scene;
      scene.add(car);

      const box = new THREE.Box3().setFromObject(car);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      car.position.x -= center.x;
      car.position.z -= center.z;
      car.position.y -= box.min.y;

      const maxSize = Math.max(size.x, size.y, size.z);
      if (maxSize > 0) {
        const scale = 4 / maxSize;
        car.scale.setScalar(scale);
      }

      // Recenter after scaling.
      const scaledBox = new THREE.Box3().setFromObject(car);
      const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
      car.position.x -= scaledCenter.x;
      car.position.z -= scaledCenter.z;
      car.position.y -= scaledBox.min.y;

      const finalBox = new THREE.Box3().setFromObject(car);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const maxDim = Math.max(finalSize.x, finalSize.y, finalSize.z);

      camera.position.set(maxDim * 1.5, maxDim * 0.8, maxDim * 1.8);
      camera.lookAt(0, maxDim * 0.35, 0);

      status.textContent = "3D car loaded! Drag nahi, abhi car dekho.";
    },

    (event) => {
      if (event.total > 0) {
        const percent = Math.round(event.loaded / event.total * 100);
        status.textContent = "Loading 3D car... " + percent + "%";
      }
    },

    (error) => {
      console.error("Car loading error:", error);
      status.textContent =
        "Car load nahi hui. Internet check karo aur page refresh karo.";
    }
  );

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

} catch (error) {
  console.error(error);
  status.textContent =
    "JavaScript/CDN error: " + (error.message || "Unknown error");
}
</script>
</body>
</html>
