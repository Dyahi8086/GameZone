<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameZone - Cyberpunk Car</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Light Grey Studio Background - Taaki Black Car Chamke */
        body {
            background-color: #d1d5db; /* Light Grey */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #111827;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh; 
            overflow: hidden;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        /* Text ko Dark kar diya taaki light bg par dikhe */
        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #000000;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .header p {
            font-size: 0.9rem;
            font-weight: 700;
            color: #374151;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hint {
            font-size: 0.85rem;
            font-weight: 600;
            color: #000000;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 600;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 20;
            text-align: center;
        }

        #loading {
            background: rgba(255, 255, 255, 0.9);
            color: #000000;
            border: 1px solid #000000;
        }

        #error {
            background: #fee2e2;
            color: #b91c1c;
            border: 2px solid #b91c1c;
            display: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
                <p>Cyberpunk Experience</p>
            </div>
            <div class="hint">
                Drag to rotate · Pinch to zoom
            </div>
        </div>

        <div id="loading">Car Loading...</div>
        <div id="error"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        // Solid Light Grey Background (Mobile pe black nahi hoga)
        scene.background = new THREE.Color(0xd1d5db); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5; 
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- ENVIRONMENT MAP (Studio reflections for black car) ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 5.0);
        topLight.position.set(0, 20, 0);
        scene.add(topLight);

        const frontLight = new THREE.DirectionalLight(0xffffff, 3.0);
        frontLight.position.set(10, 10, 10);
        scene.add(frontLight);

        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        controls.minDistance = 3; 
        controls.maxDistance = 25;
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };
        
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        // --- LOAD MODEL ---
        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const modelPath = './cyberpunk_car.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                // 1. Car ko ekdum perfect center mein laane ka foolproof tarika
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                
                // Car ko uske asli center par shift kar do
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                // 2. Ek invisible Group banate hain jo car ko hold karega
                const carGroup = new THREE.Group();
                carGroup.add(model);
                scene.add(carGroup); // Group ko scene mein daala

                // 3. Camera Setup (Perfect Zoom Out)
                // Car kitni badi hai ye check karo
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                // Camera ko itna door rakho ki poori car screen mein aaye
                let cameraDistance = maxDim * 2.5; 
                
                // Camera ko ek diagonal angle se set karo
                camera.position.set(cameraDistance * 0.7, cameraDistance * 0.4, cameraDistance * 0.7);
                camera.lookAt(0, 0, 0);

                controls.target.set(0, 0, 0);
                controls.update();
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.textContent = `Loading Car... ${percent}%`;
                }
            },
            (error) => {
                console.error('Error:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = `Model Load Failed! Check File Name.`;
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
