<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE MACHINE | GameZone</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #090b10;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  position: absolute;
  top: 22px;
  left: 6%;
  z-index: 2;
  pointer-events: none;
}

h1 {
  margin: 0;
  font-size: clamp(26px, 6vw, 48px);
  letter-spacing: 4px;
}

header p {
  color: #aaa;
  font-size: 15px;
}

#stage {
  width: 100vw;
  height: 100dvh;
  touch-action: none;
}

#status {
  position: absolute;
  left: 5%;
  bottom: 20px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #151820e8;
  color: white;
  font-size: 13px;
  max-width: 90%;
  pointer-events: none;
}

#hint {
  position: absolute;
  right: 5%;
  bottom: 22px;
  color: #bbb;
  font-size: 11px;
  text-align: right;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <h1>THE MACHINE</h1>
  <p>One car. Dark studio. Pure detail.</p>
</header>

<div id="stage"></div>
<div id="status">Loading 3D car...</div>
<div id="hint">DRAG TO ROTATE<br>PINCH TO ZOOM</div>

<script type="module">
const status = document.getElementById("status");

try {
  const THREE = await import("three");
  const { GLTFLoader } =
    await import("three/addons/loaders/GLTFLoader.js");
  const { OrbitControls } =
    await import("three/addons/controls/OrbitControls.js");

  const stage = document.getElementById("stage");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090b10);

  const camera = new THREE.PerspectiveCamera(
    45, window.innerWidth / window.innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  stage.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 2.2));

  const keyLight = new THREE.DirectionalLight(0xffffff, 3);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0x729bff, 2);
  rimLight.position.set(-5, 4, -6);
  scene.add(rimLight);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(5, 96),
    new THREE.MeshStandardMaterial({
      color: 0x303138,
      roughness: 0.65,
      metalness: 0.15
    })
  );

  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.025;
  scene.add(floor);

  // Camera controls: touch rotation and pinch zoom
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.minDistance = 2;
  controls.maxDistance = 14;
  controls.minPolarAngle = 0.25;
  controls.maxPolarAngle = Math.PI / 2.05;
  controls.rotateSpeed = 0.8;
  controls.zoomSpeed = 0.8;

  const loader = new GLTFLoader();

  loader.load(
    "./cartoon_sports_car.glb",

    (gltf) => {
      const car = gltf.scene;

      // Fit model inside the scene
      const originalBox = new THREE.Box3().setFromObject(car);
      const originalSize = originalBox.getSize(new THREE.Vector3());
      const originalCenter = originalBox.getCenter(new THREE.Vector3());

      const largest = Math.max(
        originalSize.x, originalSize.y, originalSize.z
      );

      if (!largest || !Number.isFinite(largest)) {
        status.textContent = "Car model size could not be detected.";
        return;
      }

      car.scale.setScalar(3.5 / largest);

      car.position.set(
        -originalCenter.x * (3.5 / largest),
        -originalBox.min.y * (3.5 / largest),
        -originalCenter.z * (3.5 / largest)
      );

      scene.add(car);

      const finalBox = new THREE.Box3().setFromObject(car);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const finalCenter = finalBox.getCenter(new THREE.Vector3());

      controls.target.copy(finalCenter);
      controls.target.y = finalBox.min.y + finalSize.y * 0.38;

      camera.position.set(
        finalCenter.x + 5,
        finalCenter.y + 2.5,
        finalCenter.z + 6
      );

      controls.update();
      controls.saveState();

      status.textContent =
        "3D car loaded! Drag to rotate • Pinch to zoom";
    },

    (event) => {
      if (event.total > 0) {
        const percent = Math.round(event.loaded / event.total * 100);
        status.textContent = "Loading 3D car... " + percent + "%";
      }
    },

    (error) => {
      console.error("GLB loading error:", error);
      status.textContent =
        "Car file load failed. Check filename and internet.";
    }
  );

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

} catch (error) {
  console.error(error);
  status.textContent = "Error: " + (error.message || "Module loading failed");
}
</script>
</body>
</html>
