<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone 3D Showcase</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #e9e8df;
}

#stage {
  position: fixed;
  inset: 0;
  touch-action: none;
}

header {
  position: absolute;
  top: 22px;
  left: 6%;
  z-index: 2;
  pointer-events: none;
  color: #25282d;
}

h1 {
  margin: 0;
  font-size: clamp(25px, 6vw, 42px);
  letter-spacing: 4px;
}

header p {
  font-size: 12px;
  letter-spacing: 2px;
  color: #666;
}

#status {
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: #ffffffd9;
  color: #333;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 12px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header>
  <h1>GAMEZONE</h1>
  <p>3D CAR EXPERIENCE</p>
</header>

<div id="stage"></div>
<div id="status">Loading 3D model...</div>

<script type="module">
const status = document.getElementById("status");

try {
  const THREE = await import("three");

  const { GLTFLoader } = await import(
    "three/addons/loaders/GLTFLoader.js"
  );

  const { OrbitControls } = await import(
    "three/addons/controls/OrbitControls.js"
  );

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e8df);

  const camera = new THREE.PerspectiveCamera(
    40, innerWidth / innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  document.getElementById("stage").appendChild(renderer.domElement);

  // Studio lighting — does not recolor the model materials
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb4b2a8, 2));

  const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
  fillLight.position.set(-5, 4, -3);
  scene.add(fillLight);

  // Neutral studio floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
      color: 0xe9e8df,
      roughness: 0.9
    })
  );

  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.03;
  scene.add(floor);

  const controls = new OrbitControls(
    camera, renderer.domElement
  );

  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.minDistance = 2;
  controls.maxDistance = 15;
  controls.minPolarAngle = 0.25;
  controls.maxPolarAngle = Math.PI / 2.05;

  const loader = new GLTFLoader();

  /*
    IMPORTANT:
    Change MODEL_FILE to the exact name of your downloaded
    model file after uploading it beside index.html.
  */
  const MODEL_FILE = "./cartoon_sports_car.glb";

  loader.load(
    MODEL_FILE,

    (gltf) => {
      const model = gltf.scene;

      // Preserve original materials, textures and colors.
      // No color-changing code is applied.

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const largest = Math.max(size.x, size.y, size.z);

      if (!largest || !Number.isFinite(largest)) {
        status.textContent = "Model dimensions could not be read.";
        return;
      }

      const scale = 3.5 / largest;
      model.scale.setScalar(scale);

      model.position.set(
        -center.x * scale,
        -box.min.y * scale,
        -center.z * scale
      );

      scene.add(model);

      const fittedBox = new THREE.Box3().setFromObject(model);
      const fittedSize = fittedBox.getSize(new THREE.Vector3());
      const fittedCenter = fittedBox.getCenter(new THREE.Vector3());

      controls.target.set(
        fittedCenter.x,
        fittedBox.min.y + fittedSize.y * 0.4,
        fittedCenter.z
      );

      camera.position.set(
        fittedCenter.x + 5,
        fittedCenter.y + 2.5,
        fittedCenter.z + 6
      );

      controls.update();
      controls.saveState();

      status.textContent = "Drag to rotate · Pinch to zoom";
    },

    (event) => {
      if (event.total > 0) {
        status.textContent =
          "Loading model... " +
          Math.round(event.loaded / event.total * 100) + "%";
      }
    },

    (error) => {
      console.error("Model loading error:", error);
      status.textContent =
        "Model not found. Check the exact file name.";
    }
  );

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

} catch (error) {
  console.error(error);
  status.textContent = "3D viewer error: " + error.message;
}
</script>

</body>
</html>
