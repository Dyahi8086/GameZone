<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameZone | 3D Car</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #e9e8df;
}

#stage {
  position: fixed;
  inset: 0;
}

header {
  position: absolute;
  top: 22px;
  left: 6%;
  z-index: 2;
  color: #25282d;
  pointer-events: none;
}

h1 {
  margin: 0;
  font-size: clamp(25px, 6vw, 42px);
  letter-spacing: 4px;
}

header p {
  margin-top: 8px;
  font-size: 12px;
  color: #666b70;
  letter-spacing: 2px;
}

#status {
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: rgba(255,255,255,.8);
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 12px;
  color: #333;
  white-space: nowrap;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <h1>GAMEZONE</h1>
  <p>3D CAR EXPERIENCE</p>
</header>

<div id="stage"></div>
<div id="status">Loading 3D car...</div>

<script type="module">
try {
  const THREE = await import("three");

  const { GLTFLoader } = await import(
    "three/addons/loaders/GLTFLoader.js"
  );

  const { OrbitControls } = await import(
    "three/addons/controls/OrbitControls.js"
  );

  const stage = document.getElementById("stage");
  const status = document.getElementById("status");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e8df);

  const camera = new THREE.PerspectiveCamera(
    40, innerWidth / innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  stage.appendChild(renderer.domElement);

  // Soft studio lighting
  scene.add(new THREE.HemisphereLight(
    0xffffff, 0xaaa9a0, 2.1
  ));

  const mainLight = new THREE.DirectionalLight(0xffffff, 3);
  mainLight.position.set(4, 8, 6);
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0xffe6c9, 1.5);
  fillLight.position.set(-5, 4, -3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xc9e5ff, 1.2);
  rimLight.position.set(0, 5, -6);
  scene.add(rimLight);

  // Studio floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(5, 96),
    new THREE.MeshStandardMaterial({
      color: 0xf5f3eb,
      roughness: 0.82,
      metalness: 0
    })
  );

  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.025;
  scene.add(floor);

  // Soft circular studio platform
  const platform = new THREE.Mesh(
    new THREE.CylinderGeometry(4.5, 4.5, 0.06, 96),
    new THREE.MeshStandardMaterial({
      color: 0xd6d4cc,
      roughness: 0.9
    })
  );

  platform.position.y = -0.07;
  scene.add(platform);

  // Keep touch rotation and pinch zoom
  const controls = new OrbitControls(
    camera, renderer.domElement
  );

  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.enableRotate = true;
  controls.enableZoom = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.minDistance = 2;
  controls.maxDistance = 14;
  controls.minPolarAngle = 0.3;
  controls.maxPolarAngle = Math.PI / 2.05;

  const loader = new GLTFLoader();

  loader.load(
    "./cartoon_sports_car.glb",

    (gltf) => {
      const car = gltf.scene;

      const box = new THREE.Box3().setFromObject(car);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const largest = Math.max(size.x, size.y, size.z);
      const scale = 3.5 / largest;

      car.scale.setScalar(scale);
      car.position.set(
        -center.x * scale,
        -box.min.y * scale,
        -center.z * scale
      );

      scene.add(car);

      // Apply a subtle blue tint to existing materials.
      // Original textures and details remain in place.
      car.traverse((obj) => {
        if (!obj.isMesh) return;

        const materials = Array.isArray(obj.material)
          ? obj.material
          : [obj.material];

        materials.forEach((material) => {
          if (!material || !material.color) return;

          material.color.multiply(
            new THREE.Color(0xb7d5ff)
          );
        });
      });

      const finalBox = new THREE.Box3().setFromObject(car);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const finalCenter = finalBox.getCenter(new THREE.Vector3());

      controls.target.set(
        finalCenter.x,
        finalBox.min.y + finalSize.y * 0.4,
        finalCenter.z
      );

      camera.position.set(
        finalCenter.x + 5,
        finalCenter.y + 2.4,
        finalCenter.z + 6
      );

      controls.update();
      controls.saveState();

      status.textContent =
        "Drag to rotate · Pinch to zoom";
    },

    (event) => {
      if (event.total > 0) {
        status.textContent =
          "Loading car... " +
          Math.round(event.loaded / event.total * 100) + "%";
      }
    },

    (error) => {
      console.error(error);
      status.textContent = "Car loading failed. Check connection.";
    }
  );

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

} catch (error) {
  console.error(error);
  document.getElementById("status").textContent =
    "Error loading 3D scene.";
}
</script>
</body>
</html>
