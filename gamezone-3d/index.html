<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>GameZone - Premium Experience</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* --- 3D HOME SCREEN --- */
        #home-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 10;
            background-color: #f3f4f6; /* Light Background for 3D */
        }

        #home-screen.hidden {
            opacity: 0;
            transform: scale(1.05); 
            pointer-events: none;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #000;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
        }

        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .enter-btn {
            pointer-events: auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #000;
            background: transparent;
            padding: 15px 40px;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .enter-btn:hover, .enter-btn:active { 
            background: #000; 
            color: #ff69b4; 
            box-shadow: 0 0 30px #ff69b4; 
            transform: scale(1.05);
        }

        /* Loading Text Fix */
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 700;
            z-index: 100;
            color: #000;
            text-align: center;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* ========================================= */
        /* --- NEW PREMIUM DASHBOARD SCREEN --- */
        /* ========================================= */
        #dashboard-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #0b0c10; 
            background-image: radial-gradient(circle at 50% 0%, #1f2330 0%, #0b0c10 70%);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #dashboard-screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        /* Animated Top Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(11, 12, 16, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .back-btn {
            background: transparent;
            color: #00ffff;
            border: 1px solid #00ffff;
            padding: 8px 20px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: 0.3s;
            letter-spacing: 1px;
            pointer-events: auto; /* Button clickable rahe */
        }

        .back-btn:hover, .back-btn:active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        /* Section Title */
        .section-title {
            text-align: center;
            margin: 40px 0 20px;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .section-title::after {
            content: "SELECT YOUR GAME";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            color: #ff0055;
            -webkit-text-stroke: 0;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            opacity: 0.8;
        }

        /* 3D Grid Layout */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            padding: 20px 40px 80px;
            perspective: 1200px; 
        }

        /* 3D Game Card */
        .game-card {
            position: relative;
            height: 380px;
            border-radius: 15px;
            background: #15171e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            transform-style: preserve-3d;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-card:hover, .game-card:active {
            transform: translateY(-10px) rotateX(5deg) rotateY(-5deg) scale(1.02);
            box-shadow: -10px 15px 40px rgba(255, 0, 85, 0.2);
            border-color: rgba(255, 0, 85, 0.5);
        }

        .card-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }
        
        .game-card:hover .card-img {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 60%;
            background: linear-gradient(to top, #0b0c10 10%, rgba(11,12,16,0.8) 50%, transparent);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .game-title {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 5px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            transform: translateZ(30px);
        }

        .game-category {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: #00ffff;
            font-weight: 700;
            letter-spacing: 1px;
            transform: translateZ(20px);
        }

        .play-action {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #ff0055;
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0;
            transition: 0.3s;
            z-index: 10;
            box-shadow: 0 0 20px #ff0055;
            pointer-events: none;
        }

        .game-card:hover .play-action, .game-card:active .play-action {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .card-badge {
            position: absolute;
            top: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 4px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 4px;
            z-index: 3;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 600px) {
            .top-nav { padding: 15px; }
            .nav-logo { font-size: 1.2rem; }
            .section-title { font-size: 1.5rem; }
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 10px 15px 50px;
            }
            .game-card { height: 220px; border-radius: 10px; }
            .game-title { font-size: 1rem; }
            .game-category { font-size: 0.8rem; }
            .card-overlay { padding: 10px; }
            .card-badge { display: none; }
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0c10; }
        ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. HOME SCREEN (3D Model) -->
    <div id="home-screen">
        <div id="loading">Loading Experience...</div>
        
        <div id="canvas-container"></div>

        <div class="ui-container">
            <div class="header">
                <h1>GameZone</h1>
            </div>
            <div class="bottom-section">
                <!-- Added type="button" -->
                <button type="button" class="enter-btn" id="enterBtn">Enter GameZone</button>
            </div>
        </div>
    </div>

    <!-- 2. PREMIUM DASHBOARD SCREEN -->
    <div id="dashboard-screen">
        <div class="top-nav">
            <div class="nav-logo">GAMEZONE</div>
            <button type="button" class="back-btn" id="backBtn">← RETURN TO 3D</button>
        </div>

        <h2 class="section-title">SELECT YOUR GAME</h2>

        <div class="games-grid">
            <!-- Card 1 -->
            <div class="game-card">
                <div class="card-badge">NEW</div>
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action">PLAY NOW</div>
                <div class="card-overlay">
                    <div class="game-title">Cyber Racer</div>
                    <div class="game-category">Racing · 3D</div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="game-card">
                <div class="card-badge">TRENDING</div>
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action">PLAY NOW</div>
                <div class="card-overlay">
                    <div class="game-title">Neon Shooter</div>
                    <div class="game-category">Action · FPS</div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="game-card">
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action">PLAY NOW</div>
                <div class="card-overlay">
                    <div class="game-title">Puzzle Matrix</div>
                    <div class="game-category">Brain · Logic</div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="game-card">
                <div class="card-badge">HOT</div>
                <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600&auto=format&fit=crop');"></div>
                <div class="play-action">PLAY NOW</div>
                <div class="card-overlay">
                    <div class="game-title">Space Explorer</div>
                    <div class="game-category">Adventure · 3D</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D SCRIPTS -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { RoomEnvironment } from 'https://unpkg.com/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';

        // --- UI LOGIC ---
        const enterBtn = document.getElementById('enterBtn');
        const backBtn = document.getElementById('backBtn');
        const homeScreen = document.getElementById('home-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');

        // Button click handler
        enterBtn.addEventListener('click', (e) => {
            e.preventDefault(); // Default behavior roko
            homeScreen.classList.add('hidden');
            setTimeout(() => {
                dashboardScreen.classList.add('active');
            }, 300);
        });

        // Back button handler
        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            dashboardScreen.classList.remove('active');
            setTimeout(() => {
                homeScreen.classList.remove('hidden');
            }, 300);
        });


        // --- 3D SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf3f4f6); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; 
        renderer.shadowMap.enabled = true; 
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
        topLight.position.set(0, 20, 10);
        topLight.castShadow = true;
        scene.add(topLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; 
        controls.enablePan = false; 
        
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.addEventListener('start', () => { controls.autoRotate = false; });

        const loader = new GLTFLoader();
        const loadingEl = document.getElementById('loading');
        const modelPath = './smol_ame_in_an_upcycled_terrarium_hololiveen.glb'; 

        loader.load(
            modelPath,
            (gltf) => {
                loadingEl.style.display = 'none';
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if(child.material) { 
                            child.material.toneMapped = false; 
                            child.material.envMapIntensity = 1.5; 
                        }
                    }
                });

                scene.add(model);

                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;

                const maxDim = Math.max(size.x, size.y, size.z);
                const fixedDistance = maxDim * 2.0; 

                camera.position.set(fixedDistance * 0.4, fixedDistance * 0.3, fixedDistance * 0.9); 
                camera.lookAt(0, 0, 0);
                
                controls.target.set(0, 0, 0);
                controls.minDistance = fixedDistance * 1.0; 
                controls.maxDistance = fixedDistance * 1.8;
                controls.update();
            },
            undefined,
            (error) => {
                loadingEl.style.display = 'none';
                alert("Model Load Failed! Check File Name in GitHub.");
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
